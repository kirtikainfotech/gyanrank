        :root{

            --brand:#2f6bff;

            --ok:#2e9d5a;
            --danger:#de4d4d;
            --radius:12px;

            --surface:#ecf1ff;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:"Times New Roman",Times,serif;background:var(--bg);color:var(--text);}
        a{text-decoration:none;color:inherit}
        .app-shell{width:95%;max-width:none;margin:0 auto;padding:18px 0;}

<body>
<div id="root"></div>

<script type="text/babel">
const { useCallback, useEffect, useMemo, useRef, useState } = React;
const detectAppBasePath = () => {
    const path = window.location.pathname || '';
    const marker = '/react-app/';
    const markerIndex = path.indexOf(marker);
    if (markerIndex > 0) return path.slice(0, markerIndex).replace(/\/$/, '');
    if (path.startsWith('/edu/')) return '/edu';
    return '';
};
const APP_BASE_PATH = detectAppBasePath();
const DETECTED_WIFI_ORIGIN = window.location.origin;
const urlParams = new URLSearchParams(window.location.search || '');
const API_OVERRIDE_BASE = (urlParams.get('api') || localStorage.getItem('edu_api_base') || window.EDU_API_BASE || '').trim();
const LOCAL_ORIGIN = (localStorage.getItem('edu_local_origin') || window.EDU_LOCAL_ORIGIN || DETECTED_WIFI_ORIGIN).replace(/\/$/, '');
const APP_PATH_PREFIX = APP_BASE_PATH || '';
const ASSET_ORIGIN = window.location.origin;
const API_BASE = API_OVERRIDE_BASE || `${ASSET_ORIGIN}${APP_PATH_PREFIX}/api/student.php`;
const API_FALLBACK_BASE = `${window.location.origin}${APP_PATH_PREFIX}/api/student.php`;
const API_LAN_BASE = `${LOCAL_ORIGIN}/edu/api/student.php`;
const BRAND_LOGO_URL = `${ASSET_ORIGIN}${APP_PATH_PREFIX}/assets/grlogo.png?v=gyannexa`;
const APP_LOGO_URL = `${ASSET_ORIGIN}${APP_PATH_PREFIX}/assets/applogo.png?v=gyannexa`;
const normalizeBrandName = (value, fallback = 'Gyan Nexa') => {
    const raw = String(value || fallback).trim() || fallback;
    return raw.replace(/gyan\s*rank/ig, (match) => match === match.toUpperCase() ? 'GYAN NEXA' : 'Gyan Nexa');
};
const getBrandName = (settings = {}, fallback = 'Gyan Nexa') => normalizeBrandName(settings.site_name || settings.app_name, fallback);
const WIFI_DEBUG = /^(localhost|127\.0\.0\.1|192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/.test(window.location.hostname || '');
if (WIFI_DEBUG) {
    console.info('[GYAN NEXA App] Local API:', API_BASE, 'Fallback:', API_FALLBACK_BASE, 'LAN:', API_LAN_BASE);
}

const AppContext = React.createContext({
    token: null, user: null, settings: {}, loading: true, setAuth: () => {}
});

const storage = {
    getToken() { return localStorage.getItem('edu_token') || ''; },
    setToken(token) {
        if (token) localStorage.setItem('edu_token', token);
        else localStorage.removeItem('edu_token');
    },
    clearToken() { localStorage.removeItem('edu_token'); }
};

const apiRequest = async (baseUrl, action, options = {}) => {
    const reqUrl = new URL(baseUrl, window.location.origin);
    reqUrl.searchParams.set('action', action);
    Object.entries(options.query || {}).forEach(([k, v]) => {
        if (v !== undefined && v !== null && `${v}` !== '') {
            reqUrl.searchParams.set(k, `${v}`);
        }
    });
    const headers = { 'Accept': 'application/json', ...(options.headers || {}) };
    if (options.token) headers.Authorization = `Bearer ${options.token}`;
    const config = options.config || {};
    const controller = config.signal ? null : new AbortController();
    const timeoutMs = Number(config.timeoutMs || options.timeoutMs || 12000);
    const timer = controller ? window.setTimeout(() => controller.abort(), timeoutMs) : null;
    try {
        const resp = await fetch(reqUrl.toString(), {
            method: options.method || 'GET',
            headers,
            body: options.body,
            credentials: 'same-origin',
            ...config,
            signal: config.signal || controller.signal
        });
        const payload = await resp.json().catch(() => ({}));
        if (!resp.ok || payload.success === false) {
            const error = new Error(payload.message || `Request failed (${resp.status})`);
            error.status = resp.status;
            error.payload = payload;
            error.fromApi = true;
            throw error;
        }
        return payload;
    } catch (error) {
        if (error?.name === 'AbortError') {
            const timeoutError = new Error('Request timed out. Please refresh and try again.');
            timeoutError.status = 0;
            throw timeoutError;
        }
        throw error;
    } finally {
        if (timer) window.clearTimeout(timer);
    }
};

const apiWithFallback = async (action, options = {}) => {
    const candidates = [API_BASE, API_FALLBACK_BASE, API_LAN_BASE].filter((url, index, list) => url && list.indexOf(url) === index);
    let lastError = null;
    for (const url of candidates) {
        try {
            return await apiRequest(url, action, options);
        } catch (error) {
            lastError = error;
            if (error.fromApi && ![0, 403, 404, 500, 502, 503, 504].includes(Number(error.status || 0))) {
                throw error;
            }
        }
    }
    throw lastError || new Error('API request failed');
};

const apiGet = async (action, query = {}, token = '', config = {}) => {
    return apiWithFallback(action, { query, token, config });
};

const apiPost = async (action, body = {}, token = '') => {
    return apiWithFallback(action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        token
    });
};

const isBillingRequiredError = (error) => {
    const payload = error?.payload || {};
    return payload.billing_required === true || (Number(error?.status || 0) === 422 && /billing information/i.test(error?.message || ''));
};

const goBillingInfo = (returnTo = '') => {
    const qs = new URLSearchParams();
    if (returnTo) qs.set('return', returnTo);
    window.location.hash = `#/billing-info${qs.toString() ? `?${qs.toString()}` : ''}`;
};

const toRupee = (value) => {
    const v = Number(value || 0);
    if (!isFinite(v)) return '\u20B90';
    if (v === 0) return 'Free';
    return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(v);
};

function secureDownloadUrl(item, token = '') {
    const raw = item?.download_url || item?.file_url || '';
    if (!raw || !token) return raw || '#/login';
    try {
        const url = new URL(raw, window.location.origin);
        url.searchParams.set('token', token);
        return url.toString();
    } catch (_) {
        return raw;
    }
}

function safeDecode(value) {
    try {
        return decodeURIComponent((value || '').trim());
    } catch (_) {
        return (value || '').trim();
    }
}

function pathSegment(path) {
    return safeDecode(String(path || '').replace(/^\/+/, ''));
}

function extractPathSegment(path = '') {
    return pathSegment(path).replace(/^category\//i, '');
}

function pathLastSegment(path = '') {
    const cleaned = pathSegment(path);
    const parts = cleaned.split('/').filter(Boolean);
    return parts[parts.length - 1] || '';
}

const safeNumber = (v, d = 0) => (Number(v || 0) ? Number(v).toFixed(d) : `0${d ? '.00' : ''}`);

function parseHashState(rawHash = '') {
    const raw = (rawHash || window.location.hash || '').replace(/^#/, '') || '/';
    const [path, queryString = ''] = raw.split('?');
    const query = new URLSearchParams(queryString.startsWith('?') ? queryString.substring(1) : queryString);
    return { path: path || '/', query };
}

function rememberLoginReturn() {
    const hash = window.location.hash || '#/';
    if (!/^#\/(login|signup)\b/.test(hash)) {
        localStorage.setItem('edu_login_return_hash', hash);
    }
    window.location.hash = '#/login';
}
function buildHash(path, query = null) {
    const parts = [path.replace(/\/+$/,'') || '/'];
    if (query && query instanceof URLSearchParams) {
        const str = query.toString();
        if (str) parts.push(str);
    }
    return `${parts.join('?')}`;
}

function useHashRoute() {
    const getState = () => parseHashState(window.location.hash);
    const [routeState, setRouteState] = useState(getState());
    useEffect(() => {
        const onHash = () => setRouteState(getState());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
    }, []);
    return [routeState, (next, query) => {
        const targetPath = next.startsWith('#') ? next.substring(1) : next;
        const nextHash = buildHash(targetPath, query && query instanceof URLSearchParams ? query : null);
        window.location.hash = nextHash.startsWith('#') ? nextHash : `#${nextHash}`;
    }];
}

function Toast({ text, kind = 'info', onClose }) {
    if (!text) return null;
    const cls = kind === 'error' ? 'msg danger' : 'msg';
    return (
        <div className={cls} style={{ position: 'fixed', top: 12, right: 12, zIndex: 60, minWidth: 230, maxWidth: 340 }}>
            <div style={{display:'flex',justifyContent:'space-between',gap:12}}>
                <span>{text}</span>
                <button onClick={onClose} style={{border:0,background:'transparent',cursor:'pointer',fontWeight:700}}>x</button>
            </div>
        </div>
    );
}

function useAuthAPI() {
    const [token, setToken] = useState(storage.getToken());
    const [user, setUser] = useState(null);
    const [settings, setSettings] = useState({});
    const [loading, setLoading] = useState(true);

    const loadProfile = async () => {
        setLoading(true);
        try {
            const profile = await apiGet('profile', {}, token);
            setUser(profile.user || null);
        } catch (e) {
            storage.clearToken();
            setToken('');
            setUser(null);
        } finally {
            setLoading(false);
        }
    };

    useEffect(() => {
        if (token) loadProfile();
        else {
            setLoading(false);
        }
    }, [token]);

    useEffect(() => {
        const ping = async () => {
            try {
                const home = await apiGet('ping', {}, token);
                setSettings(home.settings || {});
            } catch (_) {
                // ignore
            }
        };
        ping();
    }, []);

    return {
        token, user, settings, loading,
        setAuth: (nextUser, nextToken, nextSettings = null) => {
            setUser(nextUser);
            setToken(nextToken || '');
            storage.setToken(nextToken || '');
            if (nextSettings) setSettings(nextSettings);
        },
        logout: () => {
            storage.clearToken();
            setUser(null);
            setToken('');
        },
        refresh: loadProfile
    };
}

                        }}

                    <button

                <div className="inline">

                                <button onClick={() => setOpenMenu(!openMenu)} className={`menu-trigger ${openMenu ? 'open' : ''}`} style={{display:'flex',alignItems:'center',gap:8}}>
                                    <div className="avatar">{profileLabel}</div>

                                        <div className="small" style={{ fontWeight: 600 }}>{user.name || user.username || 'Student'}</div>

                                </button>
                                <div className={`menu ${openMenu ? 'open' : ''}`}>
                                    <a href="#/dashboard" onClick={() => setOpenMenu(false)}>Dashboard</a>
                                    <a href="#/profile" onClick={() => setOpenMenu(false)}>Profile</a>
                                    <button onClick={() => { setOpenMenu(false); logout(); }}>Logout</button>
                                </div>
                            </div>
                        </>
                    ) : (
                        <>
                            <a className="btn secondary" href="#/login">Login</a>
                            <a className="btn" href="#/signup">Create Account</a>
                        </>
                    )}
                </div>
            </div>
        </header>
    );
}

function DocumentDetailPage({ token, documentId }) {
    const id = Number(documentId || 0);
    const [state, setState] = useState({ loading: true, document: null, plans: [] });
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');
    const [msg, setMsg] = useState('');

    const load = useCallback(async () => {
        try {
            const data = await apiGet('document', { id }, token || '');
            setState({ loading: false, document: data.document || null, plans: data.plans || [] });
        } catch (e) {
            setErr(e.message || 'Document not found');
            setState((prev) => ({ ...prev, loading: false }));
        }
    }, [id, token]);

    useEffect(() => { load(); }, [load]);

    const unlock = async () => {
        if (!token) {
            window.location.hash = '#/login';
            return;
        }
        setBusy(true);
        setErr('');
        setMsg('');

            const data = await apiPost('purchase_resource', { resource_id: id }, token);

            setState((prev) => ({ ...prev, document: nextDoc }));

function PdfReaderPage({ token, documentId }) {
    const id = Number(documentId || 0);
    const [state, setState] = useState({ loading: true, document: null });
    const [err, setErr] = useState('');
    const [msg, setMsg] = useState('');
    const [busy, setBusy] = useState(false);

    useEffect(() => {
        let stop = false;
        (async () => {
            try {
                const data = await apiGet('document', { id }, token);
                const doc = data.document || null;
                if (!doc || doc.locked) {
                    window.location.hash = `#/document/${id}`;
                    return;
                }
                if (!stop) {
                    setState({ loading: false, document: doc });
                }
            } catch (e) {
                if (!stop) {
                    setErr(e.message || 'PDF reader failed');
                    setState({ loading: false, document: null });
                }
            }
        })();
        return () => { stop = true; };
    }, [id, token]);

    useEffect(() => {
        const blockKeys = (event) => {
            const key = String(event.key || '').toLowerCase();
            const blockedCombo = (event.ctrlKey || event.metaKey) && ['s', 'p', 'u'].includes(key);
            const blockedPrint = key === 'printscreen';
            if (blockedCombo || blockedPrint) {
                event.preventDefault();
                event.stopPropagation();
                if (blockedPrint && navigator.clipboard?.writeText) {
                    navigator.clipboard.writeText('').catch(() => {});
                }
                return false;
            }
            return true;
        };
        const blockContext = (event) => {
            event.preventDefault();
            event.stopPropagation();
            return false;
        };
        window.addEventListener('keydown', blockKeys, true);
        window.addEventListener('contextmenu', blockContext, true);
        return () => {
            window.removeEventListener('keydown', blockKeys, true);
            window.removeEventListener('contextmenu', blockContext, true);
        };
    }, []);

    if (state.loading) return <PageLoader label="Opening PDF reader" />;
    if (!state.document) return <Message text={err || 'PDF not available'} kind="error" />;

    const doc = state.document;
    const pdfUrl = secureDownloadUrl(doc, token);
    const readerUrl = `${pdfUrl}#toolbar=0&navpanes=0&view=FitH`;
    const pageCount = Math.max(1, Number(doc.page_count || 1));
    const readerHeight = Math.max(1200, pageCount * 980);
    const completion = doc.completion || {};
    const isExamDoc = (doc.document_purpose || '') === 'exam';
    const docContext = isExamDoc ? (doc.exam_category_name || doc.exam_title || 'Exam preparation') : (doc.course_title || 'Course');
    const availableAt = completion.available_at ? new Date(String(completion.available_at).replace(' ', 'T')).toLocaleString() : '';
    const markComplete = async () => {
        if (!completion.can_mark || completion.completed) return;
        const ok = window.confirm('Kya aap is PDF ko complete mark karna chahte hain? Ye action aapke profile me completed status dikhayega.');
        if (!ok) return;
        setBusy(true);
        setErr('');
        setMsg('');
        try {
            const out = await apiPost('mark_pdf_complete', { resource_id: id }, token);
            setState((prev) => ({ ...prev, document: out.document || prev.document }));
            setMsg(out.message || 'PDF marked as complete.');
        } catch (e) {
            setErr(e.message || 'PDF complete mark failed');
        } finally {
            setBusy(false);
        }
    };

    return (
        <section className="pdf-reader-page" onContextMenu={(e) => e.preventDefault()} onDragStart={(e) => e.preventDefault()}>
            <main className="pdf-reader-frame">
                <iframe title={doc.resource_title || 'PDF reader'} src={readerUrl} style={{ height: `${readerHeight}px` }}></iframe>
            </main>
            <aside className="pdf-reader-panel">
                {msg ? <Message text={msg} /> : null}
                {err ? <Message text={err} kind="error" /> : null}
                <h2>{doc.resource_title || 'Course PDF'}</h2>
                <p className="muted">{docContext}</p>
                <div className="document-access-box">
                    <b>{completion.completed ? 'Completed' : completion.can_mark ? 'Ready to complete' : 'Complete locked'}</b>
                    <p>
                        {completion.completed
                            ? 'Ye PDF complete mark ho chuki hai.'
                            : completion.can_mark
                            ? 'Required reading time complete hai. Ab aap PDF ko complete mark kar sakte hain.'
                            : availableAt
                            ? `Mark complete ${availableAt} ke baad available hoga. Rule: ${completion.required_hours || pageCount} hours.`
                            : (completion.message || 'PDF open karne ke baad completion timer start hoga.')}
                    </p>
                </div>
                {(completion.can_mark || completion.completed) ? (
                    <button className="btn" onClick={markComplete} disabled={busy || completion.completed}>
                        {busy ? 'Please wait...' : completion.completed ? 'Completed' : 'Mark as Complete'}
                    </button>
                ) : null}
                <a className="btn secondary" href={`#/document/${id}`}>PDF Details</a>
            </aside>
        </section>
    );
}

    const basePrice = Number(plan.monthly_price || 0);

    const yearly = billingCycle === 'yearly' && !isFree;
    return {
        price: isFree ? 0 : (yearly ? Math.round(basePrice * 10) + 9 : basePrice),
        validityDays: isFree ? 30 : (yearly ? 365 : 30),
        resetPeriod: isFree ? 'one_time' : 'monthly',

        cycleLabel: isFree ? 'Free access' : (yearly ? 'Yearly access' : 'Monthly access'),

function BillingInfoPage({ token, returnTo = '#/active-plan' }) {
    const [state, setState] = useState({ loading: true, states: {}, seller: null });
    const [form, setForm] = useState({
        legal_name: '',
        email: '',
        phone: '',
        gstin: '',
        address_line: '',
        city: '',
        state_code: '09',
        pincode: ''
    });
    const [err, setErr] = useState('');
    const [msg, setMsg] = useState('');
    const [saving, setSaving] = useState(false);
    useEffect(() => {
        let stop = false;
        (async () => {
            try {
                const data = await apiGet('billing_profile', {}, token);
                if (stop) return;
                const profile = data.billing_profile || {};
                setState({ loading: false, states: data.states || {}, seller: data.seller_state || null });
                setForm((prev) => ({
                    ...prev,
                    legal_name: profile.legal_name || '',
                    email: profile.email || '',
                    phone: profile.phone || '',
                    gstin: profile.gstin || '',
                    address_line: profile.address_line || '',
                    city: profile.city || '',
                    state_code: profile.state_code || '09',
                    pincode: profile.pincode || ''
                }));
            } catch (e) {
                if (!stop) {
                    setErr(e.message || 'Billing information could not be loaded.');
                    setState((prev) => ({ ...prev, loading: false }));
                }
            }
        })();
        return () => { stop = true; };
    }, [token]);
    const update = (key, value) => setForm((prev) => ({ ...prev, [key]: value }));
    const submit = async (event) => {
        event.preventDefault();
        setSaving(true);
        setErr('');
        setMsg('');
        try {
            const data = await apiPost('save_billing_profile', form, token);
            setMsg(data.message || 'Billing information saved.');
            window.setTimeout(() => {
                window.location.hash = returnTo || '#/active-plan';
            }, 650);
        } catch (e) {
            setErr(e.message || 'Billing information could not be saved.');
        } finally {
            setSaving(false);
        }
    };
    if (state.loading) return <PageLoader label="Loading billing details" />;
    const states = state.states || {};
    const sellerCode = String(state.seller?.seller_state_code || '09').padStart(2, '0');
    const buyerCode = String(form.state_code || '').padStart(2, '0');
    const sameState = buyerCode && buyerCode === sellerCode;
    return (
        <StudentAccountLayout active="billing-info">
            <section className="student-billing-page">
                <div className="billing-hero">
                    <div>
                        <span className="dash-kicker">GST Billing</span>
                        <h1>Billing Information</h1>
                        <p>Required before paid purchases. This information will appear on your GST invoice.</p>
                    </div>
                    <a className="btn secondary" href={returnTo || '#/active-plan'}>Back</a>
                </div>
                {err ? <Message text={err} kind="error" /> : null}
                {msg ? <Message text={msg} kind="success" /> : null}
                <form className="billing-form-card" onSubmit={submit}>
                    <div className="billing-form-head">
                        <h2>Student billing profile</h2>
                        <p>Invoice serial number will follow state-wise GST format.</p>
                    </div>
                    <div className="billing-form-grid">
                        <div className="billing-field"><label>Legal name *</label><input value={form.legal_name} onChange={(e) => update('legal_name', e.target.value)} required /></div>
                        <div className="billing-field"><label>Email *</label><input type="email" value={form.email} onChange={(e) => update('email', e.target.value)} required /></div>
                        <div className="billing-field"><label>Phone *</label><input value={form.phone} onChange={(e) => update('phone', e.target.value)} required /></div>
                        <div className="billing-field"><label>GSTIN (optional)</label><input value={form.gstin} onChange={(e) => update('gstin', e.target.value.toUpperCase())} placeholder="22AAAAA0000A1Z5" /></div>
                        <div className="billing-field full"><label>Billing address *</label><textarea value={form.address_line} onChange={(e) => update('address_line', e.target.value)} required /></div>
                        <div className="billing-field"><label>City *</label><input value={form.city} onChange={(e) => update('city', e.target.value)} required /></div>
                        <div className="billing-field"><label>State code *</label><select value={form.state_code} onChange={(e) => update('state_code', e.target.value)} required>{Object.entries(states).map(([code, name]) => <option key={code} value={code}>{code} - {name}</option>)}</select></div>
                        <div className="billing-field"><label>Pincode *</label><input value={form.pincode} onChange={(e) => update('pincode', e.target.value)} required /></div>
                    </div>
                    <div className="billing-tax-note">
                        <span><b>Seller state</b>{sellerCode} - {state.seller?.seller_state_name || states[sellerCode] || 'Uttar Pradesh'}</span>
                        <span><b>Buyer state</b>{buyerCode || '-'} - {states[buyerCode] || '-'}</span>
                        <span><b>Tax split</b>{sameState ? 'CGST + SGST' : 'IGST'}</span>
                    </div>
                    <div className="billing-form-actions">
                        <p>Invoice example: GR/26-27/{buyerCode || 'ST'}/000001</p>
                        <button className="btn" type="submit" disabled={saving}>{saving ? 'Saving...' : 'Save Billing Info'}</button>
                    </div>
                </form>
            </section>
        </StudentAccountLayout>
    );
}

function StudentBillingPage({ token, view }) {
    const [state, setState] = useState({ loading: true, plans: [], report: null });
    const [err, setErr] = useState('');
    const [busyTxn, setBusyTxn] = useState('');
    useEffect(() => {
        let stop = false;
        (async () => {
            try {
                const [home, report] = await Promise.all([
                    apiGet('home', {}, token),
                    apiGet('student_report', {}, token)
                ]);
                if (!stop) setState({ loading: false, plans: home.plans || [], report });
            } catch (e) {
                if (!stop) {
                    setErr(e.message || 'Billing data load nahi ho paya.');
                    setState((s) => ({ ...s, loading: false }));
                }
            }
        })();
        return () => { stop = true; };
    }, [token]);
    if (state.loading) return <PageLoader label="Loading account" />;
    if (err) return <StudentAccountLayout active={view}><Message text={err} kind="error" /></StudentAccountLayout>;
    const report = state.report || {};
    const subscription = report.subscription || null;
    const purchases = report.purchases || [];
    const currentPrice = Number(subscription?.monthly_price || subscription?.amount || 0);
    const currentPlanId = Number(subscription?.plan_id || subscription?.id || 0);
    const betterPlan = (state.plans || [])
        .filter((plan) => Number(plan.id) !== currentPlanId && Number(plan.monthly_price || 0) > currentPrice)
        .sort((a, b) => Number(a.monthly_price || 0) - Number(b.monthly_price || 0))[0] || null;
    const invoices = purchases.filter((row) => row.invoice_no || String(row.payment_status || '').toLowerCase() === 'paid');
    const retryPayment = async (txn) => {
        if (!txn) return;
        setBusyTxn(txn);
        try {
            const data = await apiPost('retry_payment', { transaction_no: txn }, token);
            if (data.payment?.payment_url) {
                window.location.href = data.payment.payment_url;
                return;
            }
            window.location.hash = '#/transactions';
        } catch (e) {
            if (isBillingRequiredError(e)) {
                goBillingInfo('#/transactions');
                return;
            }
            alert(e.message || 'Payment retry start nahi ho paya.');
        } finally {
            setBusyTxn('');
        }
    };
    const gstSummary = (row) => {
        const type = String(row.gst_type || '').toLowerCase();
        const cgst = Number(row.cgst_amount || 0);
        const sgst = Number(row.sgst_amount || 0);
        const igst = Number(row.igst_amount || 0);
        if (type === 'intra_state' || (cgst > 0 || sgst > 0)) {
            return <span className="gst-lines"><span className="gst-chip cgst">CGST {toRupee(cgst)}</span><span className="gst-chip cgst">SGST {toRupee(sgst)}</span></span>;
        }
        if (type === 'inter_state' || igst > 0) {
            return <span className="gst-lines"><span className="gst-chip igst">IGST {toRupee(igst)}</span></span>;
        }
        return <span className="gst-lines"><span className="gst-chip">No GST</span></span>;
    };
    const pageTitle = {
        'active-plan': 'Active Plan',
        transactions: 'Transactions',
        invoices: 'Invoices',
        'upgrade-plan': 'Upgrade Plan',
    }[view] || 'Billing';
    return (
        <StudentAccountLayout active={view}>
            <section className="student-billing-page">
                <div className="billing-hero">
                    <div>
                        <span className="dash-kicker">Student Billing</span>
                        <h1>{pageTitle}</h1>
                        <p>Membership, payment records, invoice aur upgrade options separate pages par arranged hain.</p>
                    </div>
                    <a className="btn secondary" href="#/dashboard">Back to Dashboard</a>
                </div>

                {view === 'active-plan' ? (
                    <div className="billing-plan-card">
                        <h2>{subscription?.plan_name || 'No active plan'}</h2>
                        <p>{subscription?.ends_at || subscription?.valid_to ? `Valid till ${subscription.ends_at || subscription.valid_to}` : 'Plan active nahi hai. Free access aur single allowed content continue rahega.'}</p>
                        <div className="sub-mini-grid">
                            <small>Course/video <b>{subscription?.video_limit || '-'}</b></small>
                            <small>PDF <b>{subscription?.pdf_limit || '-'}</b></small>
                            <small>Exam <b>{subscription?.exam_limit || '-'}</b></small>
                        </div>
                        {betterPlan ? <div className="upgrade-note"><span><b>Better plan available</b>{betterPlan.plan_name} plan {toRupee(betterPlan.monthly_price || 0)} me zyada access deta hai.</span><a href="#/upgrade-plan">Upgrade</a></div> : null}
                        <div className="billing-plan-actions">
                            <a className="btn" href="#/upgrade-plan">Upgrade Plan</a>
                            <a className="btn secondary" href="#/transactions">Transactions</a>
                            <a className="btn secondary" href="#/invoices">Invoices</a>
                        </div>
                    </div>
                ) : null}

                {view === 'transactions' ? (
                    <div className="billing-table-card">
                        <div className="billing-table-head"><div><h3>Payment Transactions</h3><p>Paid, pending aur failed records.</p></div><span>{purchases.length} records</span></div>
                        {purchases.length ? <table className="billing-table"><thead><tr><th>Item</th><th>Type</th><th>Amount</th><th>Status</th><th>Transaction</th><th>Action</th></tr></thead><tbody>
                            {purchases.map((row) => {
                                const paid = String(row.payment_status || '').toLowerCase() === 'paid';
                                return <tr key={`${row.type}-${row.id}`}><td data-label="Item"><b>{row.title || 'Purchase'}</b><small>{row.purchased_at || '-'}</small></td><td data-label="Type">{row.type || '-'}</td><td data-label="Amount">{toRupee(row.amount || 0)}</td><td data-label="Status"><span className={`status-pill ${paid ? 'paid' : ''}`}>{row.payment_status || 'pending'}</span></td><td data-label="Txn">{row.transaction_no || '-'}</td><td data-label="Action">{paid ? <a className="btn secondary" href="#/invoices">Invoice</a> : <button className="btn" onClick={() => retryPayment(row.transaction_no)} disabled={busyTxn === row.transaction_no}>{busyTxn === row.transaction_no ? 'Wait' : 'Retry'}</button>}</td></tr>;
                            })}
                        </tbody></table> : <div className="billing-empty">No transaction record yet.</div>}
                    </div>
                ) : null}

                {view === 'invoices' ? (
                    <div className="billing-table-card">
                        <div className="billing-table-head"><div><h3>Invoices</h3><p>Paid purchase ke invoice records.</p></div><span>{invoices.length} invoices</span></div>
                        {invoices.length ? <table className="billing-table"><thead><tr><th>Invoice</th><th>Item</th><th>Taxable</th><th>GST</th><th>Total</th><th>Place</th><th>Date</th></tr></thead><tbody>
                            {invoices.map((row) => <tr key={`${row.type}-${row.id}`}><td data-label="Invoice"><span className="invoice-badge">{row.invoice_no || 'Generating'}</span><small>{row.transaction_no || '-'}</small></td><td data-label="Item"><b>{row.title || 'Purchase'}</b><small>{row.type || '-'}</small></td><td data-label="Taxable">{toRupee(row.invoice_taxable_amount ?? row.amount ?? 0)}</td><td data-label="GST">{gstSummary(row)}</td><td data-label="Total">{toRupee(row.invoice_total_amount ?? row.amount ?? 0)}</td><td data-label="Place">{row.place_of_supply_code || row.buyer_state_code || '-'}<small>{row.place_of_supply_name || row.buyer_state_name || '-'}</small></td><td data-label="Date">{row.invoice_date || row.purchased_at || '-'}</td></tr>)}
                        </tbody></table> : <div className="billing-empty">Paid invoice abhi available nahi hai.</div>}
                    </div>
                ) : null}

                {view === 'upgrade-plan' ? (
                    <div className="billing-table-card">
                        <div className="billing-table-head"><div><h3>Upgrade Membership</h3><p>Daily, weekly, monthly ya one-time limit ke plans yahan se activate karein.</p></div><a href="#/active-plan">Current Plan</a></div>
                        <div className="billing-plan-grid" style={{padding:14}}>
                            {(state.plans || []).map((plan, index) => <PlanCard key={plan.id} plan={plan} index={index} />)}
                            {(state.plans || []).length === 0 ? <div className="billing-empty">No membership plan configured.</div> : null}
                        </div>
                    </div>
                ) : null}
            </section>
        </StudentAccountLayout>
    );
}

        <a className="dash-mini-row exam-row" href={`#/exam/${exam.id}`}>
            <span className="mini-icon">EX</span>
            <span><b>{exam.title}</b><small>{exam.course_title || 'Mock Test'}  -  {min} min left</small></span>
            <em>Continue</em>
        </a>
    );
}

function DashboardDocumentRow({ doc }) {
    const isExamDoc = (doc.document_purpose || '') === 'exam';

function AuthModalPage({ onLogin, onToast, initialMode = 'login', onClose = null, onModeChange = null }) {
    const { settings } = React.useContext(AppContext);
    const appName = getBrandName(settings, 'GYAN NEXA');
    const [mode, setMode] = useState(initialMode === 'signup' ? 'signup' : 'login');
    const [identity, setIdentity] = useState('');
    const [password, setPassword] = useState('');
    const initialReferral = (() => {
        const qs = new URLSearchParams(String(window.location.hash || '').split('?')[1] || '');
        return qs.get('ref') || qs.get('referral_code') || '';
    })();
    const [form, setForm] = useState({ name: '', email: '', phone: '', password: '', referral_code: initialReferral });
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');
    const [msg, setMsg] = useState('');

    const submitLogin = async (e) => {
        e.preventDefault();
        setBusy(true);
        setErr('');
        setMsg('');
        try {
            const data = await apiPost('login', { identity, password }, '');
            if (data.redirect_url) {
                window.location.href = data.redirect_url;
                return;
            }
            onLogin(data.user, data.token, data.settings || null);
            onToast?.('Welcome back', 'info');
        } catch (e2) {
            setErr(e2.message || 'Login failed');
            onToast?.(e2.message || 'Login failed', 'error');
        } finally { setBusy(false); }
    };

    const submitSignup = async (e) => {
        e.preventDefault();
        setBusy(true);
        setErr('');
        setMsg('');
        try {
            const body = await apiPost('signup', form, '');
            setMsg(body.message || 'Account created');
            if (body.token) {
                onLogin(body.user, body.token, body.settings || null);
                return;
            }
            setMode('login');
        } catch (e2) {
            setErr(e2.message || 'Signup failed');
            onToast?.(e2.message || 'Signup failed', 'error');
        } finally { setBusy(false); }
    };

    const switchMode = (nextMode) => {
        setMode(nextMode);
        setErr('');
        setMsg('');
        if (onModeChange) {
            onModeChange(nextMode);
        } else {
            window.history.replaceState(null, '', `${window.location.pathname}#/${nextMode}`);
        }
    };

    return (
        <section className="auth-modal-screen">
            <div className="auth-modal">
                <button className="auth-close" type="button" onClick={() => onClose ? onClose() : (window.location.hash = '#/')} aria-label="Close">x</button>
                <aside className="auth-side">
                    <div>
                        <div className="auth-brand">{appName}</div>
                        <h2>Login, learn and track everything from one account.</h2>
                        <p>Courses, PDFs, live classes, mock tests, Gcoin wallet and progress reports stay protected behind your learner login.</p>
                        <div className="auth-mini-list">
                            <span>Secure access for paid content</span>
                            <span>Plan based videos, PDFs and exams</span>
                            <span>Progress timeline and achievements</span>
                        </div>
                    </div>
                    <p>New learners can create an account in less than a minute.</p>
                </aside>
                <div className="auth-panel">
                    <div className="auth-tabs">
                        <button type="button" className={`auth-tab ${mode === 'login' ? 'active' : ''}`} onClick={() => switchMode('login')}>Login</button>
                        <button type="button" className={`auth-tab ${mode === 'signup' ? 'active' : ''}`} onClick={() => switchMode('signup')}>Signup</button>
                    </div>
                    <div className="auth-heading">
                        <h2>{mode === 'login' ? 'Welcome back' : 'Create learner account'}</h2>
                        <p>{mode === 'login' ? 'Use email, mobile number or username to continue.' : 'Start learning with protected access and progress tracking.'}</p>
                    </div>
                    {msg ? <Message text={msg} /> : null}
                    {err ? <Message text={err} kind="error" /> : null}
                    {mode === 'login' ? (
                        <form className="auth-form" onSubmit={submitLogin}>
                            <AuthField label="Email / Mobile / Username" icon="user"><input className="input auth-input" value={identity} onChange={(e) => setIdentity(e.target.value)} autoComplete="off" required /></AuthField>
                            <AuthField label="Password" icon="lock"><input className="input auth-input" type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" required /></AuthField>
                            <div className="auth-foot auth-forgot"><a href="forgot-password">Forgot password?</a></div>
                            <button className="auth-primary" disabled={busy}>{busy ? 'Signing in...' : 'Login'}</button>
                            <div className="auth-foot">New here? <button type="button" onClick={() => switchMode('signup')}>Create account</button></div>
                        </form>
                    ) : (
                        <form className="auth-form" onSubmit={submitSignup}>
                            <AuthField label="Full Name" icon="user"><input className="input auth-input" required value={form.name} onChange={(e) => setForm((v) => ({ ...v, name: e.target.value }))} autoComplete="off" /></AuthField>
                            <AuthField label="Email" icon="mail"><input className="input auth-input" type="email" required value={form.email} onChange={(e) => setForm((v) => ({ ...v, email: e.target.value }))} autoComplete="off" /></AuthField>
                            <AuthField label="Phone" icon="phone"><input className="input auth-input" maxLength="10" required value={form.phone} onChange={(e) => setForm((v) => ({ ...v, phone: e.target.value.replace(/[^0-9]/g, '').slice(0, 10) }))} autoComplete="off" /></AuthField>
                            <AuthField label="Password" icon="lock"><input className="input auth-input" type="password" required value={form.password} onChange={(e) => setForm((v) => ({ ...v, password: e.target.value }))} autoComplete="new-password" /></AuthField>
                            <AuthField label="Referral Code" icon="gift"><input className="input auth-input" value={form.referral_code} onChange={(e) => setForm((v) => ({ ...v, referral_code: e.target.value.toUpperCase().replace(/\s+/g, '') }))} placeholder="Optional" autoComplete="off" /></AuthField>
                            <button className="auth-primary" disabled={busy}>{busy ? 'Creating account...' : 'Create account'}</button>
                            <div className="auth-foot">Already registered? <button type="button" onClick={() => switchMode('login')}>Login now</button></div>
                        </form>
                    )}
                </div>
            </div>
        </section>
    );
}

function CoursesPage({ query }) {
    const [state, setState] = useState({ loading: true, items: [] });
    const [q, setQ] = useState(query?.get('q') || '');
    const [filter, setFilter] = useState(() => query?.get('cat') || 'all');
    const [subCategory, setSubCategory] = useState(() => query?.get('sub') || 'all');
    const [language, setLanguage] = useState('all');
    const [level, setLevel] = useState('all');
    const [instructor, setInstructor] = useState(() => query?.get('instructor') || '');
    const [instructorId, setInstructorId] = useState(() => query?.get('instructor_id') || '');
    const [sortBy, setSortBy] = useState('latest');
    const [page, setPage] = useState(1);
    const [filterOpen, setFilterOpen] = useState(false);
    const pageSize = 8;

    useEffect(() => {
        let stop = false;
        (async () => {
            try {
                const data = await apiGet('courses', {}, '');
                if (!stop) setState({ loading: false, items: data.courses || [] });
            } catch (e) {
                if (!stop) setState({ loading: false, items: [] });
            }
        })();
        return () => { stop = true; };
    }, []);

    const categories = useMemo(() => {
        const map = new Set(['all']);
        state.items.forEach((c) => {
            const name = c.category_name || c.category;
            if (name) map.add(name);
        });
        return Array.from(map);
    }, [state.items]);

    const subCategories = useMemo(() => {
        const map = new Set(['all']);
        state.items.forEach((c) => {
            const inCategory = filter === 'all' || c.category_name === filter || c.category === filter;
            if (!inCategory) return;
            map.add(c.subcategory_name || 'General');
        });
        return Array.from(map);
    }, [state.items, filter]);

    const levels = useMemo(() => {
        const set = new Set(['all']);
        state.items.forEach((c) => c.course_level && set.add(c.course_level));
        return Array.from(set);
    }, [state.items]);

    const languages = useMemo(() => {
        const set = new Set(['all']);
        state.items.forEach((c) => c.course_language && set.add(c.course_language));
        return Array.from(set);
    }, [state.items]);

    const filtered = useMemo(() => {
        const list = state.items.filter((c) => {
            if (filter !== 'all' && c.category_name !== filter && c.category !== filter) return false;
            if (subCategory !== 'all' && (c.subcategory_name || 'General') !== subCategory) return false;
            if (language !== 'all' && String(c.course_language || '').toLowerCase() !== language.toLowerCase()) return false;
            if (level !== 'all' && String(c.course_level || '').toLowerCase() !== level.toLowerCase()) return false;
            if (instructorId) {
                if (String(c.instructor_id || '') !== String(instructorId)) return false;
            } else if (instructor && String(c.instructor_name || '').toLowerCase() !== instructor.toLowerCase()) {
                return false;
            }
            if (!q) return true;
            const n = `${c.title} ${c.instructor_name} ${c.short_description}`.toLowerCase();
            return n.includes(q.toLowerCase());
        });
        if (sortBy === 'oldest') {
            return [...list].reverse();
        }
        if (sortBy === 'free') {
            return [...list].sort((a, b) => {
                const pa = Number(a.is_free) ? 0 : Number(a.price || 0);
                const pb = Number(b.is_free) ? 0 : Number(b.price || 0);
                return pa - pb;
            });
        }
        if (sortBy === 'popular') {
            return [...list].sort((a, b) => Number((b.chapter_count || 0)) - Number((a.chapter_count || 0)));
        }
        return list;
    }, [state.items, filter, q, sortBy, language, level, instructor, instructorId, subCategory]);

    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    const currentItems = filtered.slice((page - 1) * pageSize, page * pageSize);

    useEffect(() => {
        setPage(1);
    }, [query, filter, subCategory, q, sortBy, language, level, instructor, instructorId, state.items.length]);

    const canPrev = page > 1;
    const canNext = page < totalPages;

    useEffect(() => {
        const currentQ = query?.get('q') || '';
        if (currentQ !== q) setQ(currentQ);
    }, [query]);

    useEffect(() => {
        const currentCategory = query?.get('cat') || 'all';
        if (currentCategory !== filter) setFilter(currentCategory);
        const currentInstructor = query?.get('instructor') || '';
        if (currentInstructor !== instructor) setInstructor(currentInstructor);
        const currentInstructorId = query?.get('instructor_id') || '';
        if (currentInstructorId !== instructorId) setInstructorId(currentInstructorId);
        const currentSub = query?.get('sub') || 'all';
        if (currentSub !== subCategory) setSubCategory(currentSub);
    }, [query]);

    useEffect(() => {
        if (!subCategories.includes(subCategory)) setSubCategory('all');
    }, [subCategories, filter, subCategory]);

    const openCourse = (course) => window.location.hash = `#/course/${course.id}`;
    const pageNumbers = useMemo(() => {
        const list = [];
        for (let i = 1; i <= totalPages; i += 1) list.push(i);
        return list;
    }, [totalPages]);
    const freeCount = state.items.filter((c) => Number(c.is_free || 0) === 1 || c.is_free === '1' || Number(c.price || 0) <= 0).length;
    const paidCount = Math.max(0, state.items.length - freeCount);
    const resetFilters = () => {
        setQ('');
        setFilter('all');
        setSubCategory('all');
        setLanguage('all');
        setLevel('all');
        setInstructor('');
        setInstructorId('');
        setSortBy('latest');
    };
    const filterControls = (
        <>
            <label>Search<input className="input" placeholder="Search courses, instructor, category..." value={q} onChange={(e) => setQ(e.target.value)} /></label>
            <label>Category<select className="input" value={filter} onChange={(e) => setFilter(e.target.value)}>
                {categories.map((cat) => <option key={cat} value={cat}>{cat === 'all' ? 'All Categories' : cat}</option>)}
            </select></label>
            <label>Subcategory<select className="input" value={subCategory} onChange={(e) => setSubCategory(e.target.value)}>
                {subCategories.map((sub) => <option key={sub} value={sub}>{sub === 'all' ? 'All Subcategory' : sub}</option>)}
            </select></label>
            <label>Language<select className="input" value={language} onChange={(e) => setLanguage(e.target.value)}>
                {languages.map((lang) => <option key={lang} value={lang}>{lang === 'all' ? 'All Language' : lang}</option>)}
            </select></label>
            <label>Level<select className="input" value={level} onChange={(e) => setLevel(e.target.value)}>
                {levels.map((lvl) => <option key={lvl} value={lvl}>{lvl === 'all' ? 'All Level' : lvl}</option>)}
            </select></label>
            <label>Sort<select className="input" value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                <option value="latest">Latest</option>
                <option value="oldest">Oldest</option>
                <option value="popular">Most modules</option>
                <option value="free">Free first</option>
            </select></label>
        </>
    );
    return (
        <section className="courses-market">
            <div className="course-topline">
                <div>
                    <div className="course-breadcrumb"><a href="#/">Home</a><span>/</span><b>Courses</b></div>
                    <h2>Courses</h2>
                    <p>{filtered.length} courses found  -  {freeCount} free  -  {paidCount} paid</p>
                </div>
                <button className="filter-open-btn" onClick={() => setFilterOpen(true)}>? Filter</button>
            </div>
            <div className="course-active-row">
                <span className="course-active-chip">{filter === 'all' ? 'All courses' : filter}</span>
                {subCategory !== 'all' ? <span className="course-active-chip">{subCategory}</span> : null}
                {language !== 'all' ? <span className="course-active-chip">{language}</span> : null}
                {level !== 'all' ? <span className="course-active-chip">{level}</span> : null}
            </div>

            {filterOpen ? (
                <div className="filter-drawer-overlay" onClick={() => setFilterOpen(false)}>
                    <aside className="filter-drawer" onClick={(e) => e.stopPropagation()}>
                        <div className="filter-drawer-head">
                            <div><h3>Filter Courses</h3><p>{filtered.length} results</p></div>
                            <button onClick={() => setFilterOpen(false)}>x</button>
                        </div>
                        <div className="filter-drawer-body">{filterControls}</div>
                        <div className="filter-drawer-foot">
                            <button className="btn secondary" onClick={resetFilters}>Reset</button>
                            <button className="btn" onClick={() => setFilterOpen(false)}>Apply Filters</button>
                        </div>
                    </aside>
                </div>
            ) : null}

            {state.loading ? <PageLoader label="Loading courses" /> : (
                <div className="course-market-grid">
                    {currentItems.map((course) => <CourseListingCard key={course.id} course={course} />)}
                    {currentItems.length === 0 ? <div className="market-empty">No courses found. Try another filter.</div> : null}
                </div>
            )}
            {filtered.length > pageSize ? (
                <div className="market-pagination">
                    <button className="btn secondary" onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={!canPrev}>Prev</button>
                    {pageNumbers.map((num) => (
                        <button
                            key={num}
                            className="btn secondary"
                            style={num === page ? {background:'#eef4ff', borderColor:'#aec2ff', color:'#155dfc'} : {}}
                            onClick={() => setPage(num)}
                        >
                            {num}
                        </button>
                    ))}
                    <button className="btn secondary" onClick={() => setPage((p) => Math.min(totalPages, p + 1))} disabled={!canNext}>Next</button>
                </div>
            ) : null}
        </section>
    );
}

    const [pdfs, setPdfs] = useState([]);
    const [loading, setLoading] = useState(true);
    useEffect(() => {

function normalizeVideoUrl(url, type = '') {
    if (!url) return '';
    const raw = String(url || '').trim();
    const yt = raw.match(/(?:v=|youtu\.be\/|embed\/|live\/|shorts\/)([A-Za-z0-9_-]{6,20})/i);
    const idOnly = /^[A-Za-z0-9_-]{10,20}$/.test(raw) && String(type || '').toLowerCase().includes('youtube');
    const videoId = yt ? yt[1] : (idOnly ? raw : '');
    if (videoId) return `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1&showinfo=0&iv_load_policy=3`;
    return '';
}

function youtubeEmbedUrl(url, type = '') {
    const raw = String(url || '').trim();
    if (!raw) return '';
    const match = raw.match(/(?:v=|youtu\.be\/|embed\/|live\/|shorts\/)([A-Za-z0-9_-]{6,20})/i);
    const idOnly = /^[A-Za-z0-9_-]{10,20}$/.test(raw) && String(type || '').toLowerCase().includes('youtube');
    const videoId = match ? match[1] : (idOnly ? raw : '');
    if (!videoId) return '';
    return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=0&controls=1&fs=1&rel=0&playsinline=1&modestbranding=1&iv_load_policy=3&cc_load_policy=0&disablekb=1&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}`;
}

function youtubeVideoId(url, type = '') {
    const raw = String(url || '').trim();
    if (!raw) return '';
    const match = raw.match(/(?:v=|youtu\.be\/|embed\/|live\/|shorts\/)([A-Za-z0-9_-]{6,20})/i);
    if (match) return match[1];
    if (/^[A-Za-z0-9_-]{10,20}$/.test(raw) && String(type || '').toLowerCase().includes('youtube')) return raw;
    return '';
}

function initialsOf(value) {
    return String(value || 'S').trim().split(/\s+/).slice(0,2).map((p)=>p[0] || '').join('').toUpperCase() || 'S';
}

function isPdfFile(url) {
    return /\.(pdf|doc|docx|xls|xlsx|ppt|pptx|txt)(\?|#|$)/i.test(String(url || ''));
}

function chapterMediaSrc(chapter) {
    const raw = String(chapter?.resource_url || '').trim();
    if (!raw) return '';
    if (isPdfFile(raw)) return raw;
    const embed = normalizeVideoUrl(raw, chapter?.content_type || '');
    return embed || raw;
}

function getProgressPercent(progressData, chapterId) {
    if (!progressData?.items) return 0;
    const item = progressData.items[String(chapterId)] || {};
    return Number(item.progress_percent || 0);
}

function isCompleted(progressData, chapterId) {
    if (!progressData?.items) return false;
    const item = progressData.items[String(chapterId)] || {};
    return item.completed === true;
}

function blockContextMenu(event) {
    event.preventDefault();
    return false;
}

        }

function CourseLearningPage({ token, courseId, selectedChapterId = '' }) {
    const { user } = React.useContext(AppContext);
    const id = Number(courseId || 0);
    const [state, setState] = useState({ loading: true, course: null, chapters: [], progress: null, enrolled: false, course_pdfs: [] });
    const [err, setErr] = useState('');
    const [msg, setMsg] = useState('');
    const [saving, setSaving] = useState(false);
    const [current, setCurrent] = useState(null);
    const [isPlaying, setIsPlaying] = useState(false);
    const playerRef = useRef(null);
    const mediaBoxRef = useRef(null);
    const autoProgressRef = useRef({});
    const storageKey = useMemo(() => `edu_learn_room_${id}_${user?.id || user?.email || 'student'}`, [id, user]);
    const [journal, setJournal] = useState({ notes: {}, summaries: {}, statuses: {}, lastId: null, updatedAt: null });

    const load = useCallback(async () => {
        try {
            const data = await apiGet('course', { id }, token);
            setState({
                loading: false,
                course: data.course,
                chapters: data.chapters || [],
                progress: data.progress || null,
                enrolled: !!data.enrolled,
                course_pdfs: data.course_pdfs || []
            });
        } catch (e) {
            setErr(e.message || 'Failed to load learning room');
            setState((prev) => ({ ...prev, loading: false }));
        }
    }, [id, token]);

    useEffect(() => { load(); }, [load]);

    useEffect(() => {
        try {
            const raw = localStorage.getItem(storageKey);
            if (raw) setJournal((prev) => ({ ...prev, ...JSON.parse(raw) }));
            else setJournal({ notes: {}, summaries: {}, statuses: {}, lastId: null, updatedAt: null });
        } catch (_) {
            setJournal({ notes: {}, summaries: {}, statuses: {}, lastId: null, updatedAt: null });
        }
    }, [storageKey]);

    useEffect(() => {
        if (!state.chapters.length) return;
        const selected = selectedChapterId ? state.chapters.find((ch) => String(ch.id) === String(selectedChapterId)) : null;
        const last = journal.lastId ? state.chapters.find((ch) => String(ch.id) === String(journal.lastId)) : null;
        const first = state.chapters.find((ch) => !ch.locked && ch.resource_url) || state.chapters[0];
        const next = selected || current || last || first || null;
        if (next && (!current || String(current.id) !== String(next.id))) {
            setCurrent(next);
        }
    }, [state.chapters, current, journal.lastId, selectedChapterId]);

    useEffect(() => {
        if (!current) return;
        window.requestAnimationFrame(() => {
            document.querySelector('.player-playlist .learn-row.active')?.scrollIntoView({ block: 'nearest' });
        });
    }, [current]);

    useEffect(() => {
        if (!isPlaying || !current || !token || !state.enrolled || current.locked) return undefined;
        const contentId = String(current.id);
        const duration = Math.max(60, Number(current.duration_minutes || 0) * 60 || 180);
        const saved = Number(state.progress?.items?.[contentId]?.watched_seconds || 0);
        autoProgressRef.current[contentId] = Math.max(Number(autoProgressRef.current[contentId] || 0), saved);
        let busy = false;
        const persist = async () => {
            if (busy) return;
            busy = true;
            autoProgressRef.current[contentId] = Math.min(duration, Number(autoProgressRef.current[contentId] || 0) + 5);
            try {
                const progress = await apiPost('update_progress', {
                    course_id: state.course.id,
                    content_id: current.id,
                    watched_seconds: Math.floor(autoProgressRef.current[contentId]),
                    duration_seconds: duration
                }, token);
                setState((prev) => ({ ...prev, progress: progress.progress || prev.progress }));
                setJournal((prev) => {
                    const next = {
                        ...prev,
                        statuses: { ...(prev.statuses || {}), [current.id]: progress.progress?.items?.[contentId]?.progress_percent >= 80 ? 'completed' : (prev.statuses?.[current.id] || 'in_progress') },
                        lastId: current.id,
                        updatedAt: new Date().toISOString()
                    };
                    localStorage.setItem(storageKey, JSON.stringify(next));
                    return next;
                });
            } catch (_) {
                // Auto progress should stay quiet; manual "Watched" still reports errors.
            } finally {
                busy = false;
            }
        };
        const timer = window.setInterval(persist, 5000);
        persist();
        return () => window.clearInterval(timer);
    }, [isPlaying, current?.id, token, state.enrolled, state.course?.id, storageKey]);

    const saveJournal = (nextPatch) => {
        setJournal((prev) => {
            const next = { ...prev, ...nextPatch, updatedAt: new Date().toISOString() };
            localStorage.setItem(storageKey, JSON.stringify(next));
            return next;
        });
    };

    const openLesson = (chapter) => {
        if (!chapter) return;
        if (chapter.locked) {
            setErr('Chapter locked. Complete previous lesson or enroll first.');
            return;
        }
        if (!chapter.resource_url) {
            setErr('No lesson content uploaded.');
            return;
        }
        setErr('');
        setMsg('');
        setCurrent(chapter);
        setIsPlaying(false);
        window.history.replaceState(null, '', `#/learn/${id}?chapter=${chapter.id}`);
        saveJournal({
            statuses: { ...(journal.statuses || {}), [chapter.id]: journal.statuses?.[chapter.id] || 'in_progress' },
            lastId: chapter.id
        });
    };

    const saveText = (kind, value) => {
        if (!current) return;
        saveJournal({
            [kind]: { ...(journal[kind] || {}), [current.id]: value },
            statuses: { ...(journal.statuses || {}), [current.id]: journal.statuses?.[current.id] || 'in_progress' },
            lastId: current.id
        });
    };

    const markComplete = async (chapter = current) => {
        if (!chapter) return;
        if (!token || !state.enrolled) { setErr('Purchase/enroll first'); return; }
        setSaving(true);
        try {
            const duration = chapter.duration_minutes ? Number(chapter.duration_minutes) * 60 : 180;
            const watched = Math.floor(duration * 0.95);
            const progress = await apiPost('update_progress', {
                course_id: state.course.id,
                content_id: chapter.id,
                watched_seconds: watched,
                duration_seconds: duration
            }, token);
            setState((prev) => ({ ...prev, progress: progress.progress || prev.progress }));
            saveJournal({
                statuses: { ...(journal.statuses || {}), [chapter.id]: 'completed' },
                lastId: chapter.id
            });
            setMsg('Progress saved.');
        } catch (e) {
            setErr(e.message || 'Progress update failed');
        } finally {
            setSaving(false);
        }
    };

    if (state.loading) return <PageLoader label="Opening learning room" />;
    if (err && !state.course) return <Message text={err} kind="error" />;

    const c = state.course || {};
    const chapters = state.chapters || [];
    const percent = Number(state.progress?.course_percent || 0);
    const media = chapterMediaSrc(current);
    const notes = current ? (journal.notes?.[current.id] || '') : '';
    const summary = current ? (journal.summaries?.[current.id] || '') : '';
    const completed = Math.max(
        chapters.filter((ch) => isCompleted(state.progress, ch.id)).length,
        Object.values(journal.statuses || {}).filter((v) => v === 'completed').length
    );
    const reportPercent = Math.max(percent, chapters.length ? Math.round((completed / chapters.length) * 100) : 0);
    const noted = Object.values(journal.notes || {}).filter((v) => String(v || '').trim()).length;
    const summarized = Object.values(journal.summaries || {}).filter((v) => String(v || '').trim()).length;
    const currentIndex = current ? chapters.findIndex((ch) => String(ch.id) === String(current.id)) : -1;
    const youtubeMedia = current && media ? youtubeEmbedUrl(media, current?.content_type || '') : '';
    const sendYoutubeCommand = (func, args = []) => {
        try {
            playerRef.current?.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args }), '*');
        } catch (_) {}
    };
    const toggleYoutubePlayback = () => {
        if (isPlaying) {
            sendYoutubeCommand('pauseVideo');
            setIsPlaying(false);
            return;
        }
        sendYoutubeCommand('playVideo');
        setIsPlaying(true);
    };
    const fullScreenPlayer = () => {
        const box = mediaBoxRef.current;
        if (box?.requestFullscreen) box.requestFullscreen().catch(() => {});
    };

    return (
        <section className="player-page youtube-watch" onContextMenu={blockContextMenu}>
            {msg ? <Message text={msg} /> : null}
            {err ? <Message text={err} kind="error" /> : null}
            <div className="player-topbar">
                <a className="player-back" href={`#/course/${id}`} aria-label="Back">Back</a>
                <div className="player-brand-title">
                    <b>{c.title || 'Course player'}</b>
                    <span>{completed}/{chapters.length} completed  -  {safeNumber(reportPercent, 2)}% performance</span>
                </div>
                <button className="btn secondary" onClick={() => markComplete()} disabled={!current || saving || current.locked}>{saving ? 'Saving' : 'Watched'}</button>
            </div>
            <div className="learn-room">
                <main className="learn-player">
                    <div ref={mediaBoxRef} className={`learn-media ${youtubeMedia ? 'protected-youtube' : ''}`} onContextMenu={blockContextMenu}>
                        {current && media ? (
                            isPdfFile(media) ? (
                                <iframe title={current.content_title || 'Course PDF'} src={media} onContextMenu={blockContextMenu}></iframe>
                            ) : youtubeMedia || media.includes('/embed/') ? (
                                <>
                                    <iframe
                                        ref={playerRef}
                                        title={current.content_title || 'Course video'}
                                        src={youtubeMedia || media}
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                        sandbox="allow-scripts allow-same-origin allow-presentation"
                                        referrerPolicy="strict-origin-when-cross-origin"
                                        onContextMenu={blockContextMenu}
                                        allowFullScreen
                                    ></iframe>
                                    {youtubeMedia ? (
                                        <>
                                            <div className="protected-video-shield" onClick={toggleYoutubePlayback} onContextMenu={blockContextMenu} title={isPlaying ? 'Pause' : 'Play'}></div>
                                            <div className="protected-video-controls" onContextMenu={blockContextMenu}>
                                                <button className={`primary player-control-toggle ${isPlaying ? 'is-paused' : 'is-play'}`} onClick={toggleYoutubePlayback}>
                                                    <span className="control-icon" aria-hidden="true"></span>
                                                    <span className="control-label">{isPlaying ? 'Pause' : 'Play'}</span>
                                                </button>
                                                <button className="player-control-restart" onClick={() => { sendYoutubeCommand('seekTo', [0, true]); sendYoutubeCommand('playVideo'); setIsPlaying(true); }}>
                                                    <span className="control-icon" aria-hidden="true"></span>
                                                    <span className="control-label">Restart</span>
                                                </button>
                                                <button className="player-control-full" onClick={fullScreenPlayer}>
                                                    <span className="control-icon" aria-hidden="true"></span>
                                                    <span className="control-label">Full screen</span>
                                                </button>
                                            </div>
                                        </>
                                    ) : null}
                                </>
                            ) : (
                                <video src={media} controls playsInline controlsList="nodownload noplaybackrate" disablePictureInPicture onContextMenu={blockContextMenu}></video>
                            )
                        ) : (
                            <div className="learn-empty"><b>No lesson selected</b><span>Choose an unlocked lesson from curriculum.</span></div>
                        )}
                    </div>
                    <div className="player-meta-card">
                        <h1>{current?.content_title || c.title || 'Course lesson'}</h1>
                        <p>{c.title}  -  {current ? `${current.content_type || 'Video'}  -  ${Number(current.duration_minutes || 0)} min` : 'Select a lesson from playlist'}</p>
                        <div className="player-meta-row">
                            <span>{chapters.length} chapters</span>
                            <span>{completed} completed</span>
                            <span>{safeNumber(reportPercent, 2)}% performance</span>
                            {currentIndex >= 0 ? <span>Lesson {currentIndex + 1}</span> : null}
                        </div>
                        <div className="player-actions">
                            <button className="btn" disabled={!current || saving || current.locked} onClick={() => markComplete()}>{saving ? 'Saving...' : 'Mark complete'}</button>
                            <a className="btn secondary" href={`#/course/${id}`}>Course detail</a>
                        </div>
                    </div>
                </main>

                <aside className="learn-panel player-playlist">
                    <div className="player-playlist-head">
                        <h2>Playlist</h2>
                        <p>{chapters.length} lessons  -  {safeNumber(reportPercent, 2)}% completed</p>
                    </div>
                <div className="course-content-list">
                    {chapters.map((ch, idx) => {
                        const watched = getProgressPercent(state.progress, ch.id);
                        const complete = isCompleted(state.progress, ch.id) || journal.statuses?.[ch.id] === 'completed';
                        const thumbId = youtubeVideoId(ch.resource_url, ch.content_type || '');
                        return (
                            <div key={ch.id} className={`learn-row ${current?.id === ch.id ? 'active' : ''} ${ch.locked ? 'locked' : ''}`} onClick={() => openLesson(ch)}>
                                <div className="content-index">
                                    {thumbId ? (
                                        <img className="yt-thumb" src={`https://i.ytimg.com/vi/${thumbId}/mqdefault.jpg`} alt="" loading="lazy" />
                                    ) : (
                                        <span className="yt-thumb-fallback">{String(idx + 1).padStart(2, '0')}</span>
                                    )}
                                </div>
                                <div className="content-info">
                                    <h3>{ch.content_title}</h3>
                                    <div className="content-meta">
                                        <span>{ch.content_type || 'Video'}</span>
                                        <span>{Number(ch.duration_minutes || 0)} min</span>
                                        {complete ? <span>Completed</span> : ch.locked ? <span>Locked</span> : <span>{safeNumber(watched, 0)}% watched</span>}
                                    </div>
                                    <div className="mini-progress"><i style={{ width: `${Math.min(100, watched)}%` }} /></div>
                                </div>
                                <div className="content-actions">
                                    <button className="icon-action" disabled={ch.locked || !ch.resource_url} onClick={(e) => { e.stopPropagation(); openLesson(ch); }}>{ch.locked ? '??' : isPdfFile(ch.resource_url) ? '?' : '?'}</button>
                                    <button className="text-action" disabled={saving || ch.locked || !ch.resource_url} onClick={(e) => { e.stopPropagation(); markComplete(ch); }}>{saving ? 'Saving' : 'Watched'}</button>
                                </div>
                            </div>
                        );
                    })}
                    {chapters.length === 0 ? <div className="empty-detail">No published chapters yet.</div> : null}
                </div>
                </aside>
            </div>
        </section>
    );
}

function HlsLivePlayer({ src, title }) {
    const videoRef = useRef(null);
    const [status, setStatus] = useState('Secure live stream loading...');

    useEffect(() => {
        const video = videoRef.current;
        if (!video || !src) return undefined;

        let hls = null;
        let cancelled = false;

        const startNative = () => {
            video.src = src;
            video.play().catch(() => {});
        };

        const startHls = () => {
            if (cancelled) return;
            setStatus('Secure live stream loading...');
            if (hls) {
                hls.destroy();
                hls = null;
            }
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                startNative();
                return;
            }
            if (window.Hls && window.Hls.isSupported()) {
                hls = new window.Hls({ lowLatencyMode: true, backBufferLength: 30, liveSyncDurationCount: 3 });
                hls.loadSource(src);
                hls.attachMedia(video);
                hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
                    setStatus('Live');
                    video.play().catch(() => {});
                });
                hls.on(window.Hls.Events.ERROR, (_, data) => {
                    if (data?.fatal) {
                        setStatus('Stream reconnect kar rahe hain...');
                        setTimeout(startHls, 1800);
                    }
                });
                return;
            }
            setStatus('HLS player supported nahi hai.');
        };

        const ensureScript = () => new Promise((resolve, reject) => {
            if (window.Hls) {
                resolve();
                return;
            }
            const existing = document.querySelector('script[data-hlsjs="1"]');
            if (existing) {
                existing.addEventListener('load', resolve, { once: true });
                existing.addEventListener('error', reject, { once: true });
                return;
            }
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
            script.async = true;
            script.dataset.hlsjs = '1';
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });

        ensureScript().then(startHls).catch(() => setStatus('HLS player load nahi hua.'));

        const onPlaying = () => setStatus('Live');
        const onWaiting = () => setStatus('Buffering...');
        video.addEventListener('playing', onPlaying);
        video.addEventListener('waiting', onWaiting);

        return () => {
            cancelled = true;
            video.removeEventListener('playing', onPlaying);
            video.removeEventListener('waiting', onWaiting);
            if (hls) hls.destroy();
        };
    }, [src]);

    return (
        <div className="hls-live-wrap">
            <video ref={videoRef} title={title || 'Live class'} controls autoPlay playsInline />
            <div className="hls-live-status">{status}</div>
        </div>
    );
}

function LiveClassRoomPage({ token, sourceType, sourceId }) {
    const [state, setState] = useState({ loading: true, item: null, comments: [], recordings: [] });
    const [comment, setComment] = useState('');
    const [err, setErr] = useState('');
    const [busy, setBusy] = useState(false);

    const load = useCallback(async () => {
        try {
            if (!token) {
                setErr('Login required to join live class.');
                setState((prev) => ({ ...prev, loading: false }));
                return;
            }
            const live = await apiGet('live_classes', {}, token);
            const item = (live.live_classes || []).find((row) =>
                String(row.source_type) === String(sourceType) && String(row.id) === String(sourceId)
            );
            const comments = await apiGet('live_comments', { source_type: sourceType, source_id: sourceId }, token || '');
            const replays = await apiGet('live_recordings', {}, token || '').catch(() => ({ recordings: [] }));
            const slug = item?.self_hosted_live?.slug || '';
            const recordings = slug
                ? (replays.recordings || []).filter((row) => String(row.playback_slug || '') === String(slug))
                : (replays.recordings || []);
            setState({ loading: false, item: item || null, comments: comments.comments || [], recordings });
        } catch (e) {
            setErr(e.message || 'Live class load failed');
            setState((prev) => ({ ...prev, loading: false }));
        }
    }, [sourceType, sourceId, token]);

    useEffect(() => { load(); }, [load]);

    const sendComment = async (e) => {
        e.preventDefault();
        const text = comment.trim();
        if (!text) return;
        if (!token) {
            setErr('Login required to comment.');
            return;
        }
        setBusy(true);
        setErr('');
        try {
            const out = await apiPost('post_live_comment', {
                source_type: sourceType,
                source_id: Number(sourceId),
                comment: text
            }, token);
            setComment('');
            setState((prev) => ({ ...prev, comments: out.comments || prev.comments }));

            setErr(e2.message || 'Comment failed');

            setBusy(false);

    const selfHosted = item.self_hosted_live || {};

                        <h2 style={{margin:'8px 0 4px'}}>{item.class_title}</h2>
                        <div className="small muted">{item.course_title || item.batch_name || 'Course'} | {item.instructor_name || 'Instructor'} | {item.class_date || '-'} {item.starts_at || ''}</div>
                    </div>
                    <a className="btn secondary" href="#/batches">All Classes</a>
