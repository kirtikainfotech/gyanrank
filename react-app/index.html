                            <HlsLivePlayer src={hlsUrl} title={item.class_title} />
                        ) : embed ? (
                            <iframe
                                src={embed}
                                title={item.class_title}
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                allowFullScreen
                                referrerPolicy="strict-origin-when-cross-origin"
                            />
                        ) : (

                                <div>
                                    <h3>Live link not available</h3>

                                        {hasSelfHosted ? 'Secure live stream token abhi available nahi hai. Refresh karke dobara try karein.' : 'Instructor ne abhi YouTube live link save nahi kiya hai.'}

function ExamPage({ token, examId }) {
    const examIdNum = Number(examId || 0);
    const [state, setState] = useState({ loading: true, exam: null, questions: [], attempts: [], active: null, mode: 'overview' });
    const [answers, setAnswers] = useState({});
    const [result, setResult] = useState(null);
    const [msg, setMsg] = useState('');
    const [err, setErr] = useState('');
    const [submitting, setSubmitting] = useState(false);
    const [starting, setStarting] = useState(false);
    const [lang, setLang] = useState('en');
    const [current, setCurrent] = useState(0);
    const [review, setReview] = useState({});
    const [remaining, setRemaining] = useState(null);

    useEffect(() => {
        if (!token) { setErr('Login required to attempt exams'); setState((p) => ({ ...p, loading: false })); return; }
        (async () => {
            try {
                const data = await apiGet('exam_overview', { exam_id: examIdNum }, token);
                setState({
                    loading: false,
                    exam: data.exam,
                    questions: [],
                    attempts: data.attempts || [],
                    active: data.active_session || null,
                    mode: 'overview'
                });
            } catch (e) {
                setErr(e.message);
                setState((p) => ({ ...p, loading: false }));
            }
        })();
    }, [token, examIdNum]);

    const loadPaper = async () => {
        if (!token) return;
        setStarting(true);
        setErr('');
        setMsg('');
        try {
            const data = await apiGet('exam_detail', { exam_id: examIdNum }, token);
            let saved = {};
            try {
                saved = JSON.parse(data.active_session?.answer_json || '{}') || {};
            } catch (_) {
                saved = {};
            }
            setAnswers(saved);
            let savedReview = {};
            try {
                savedReview = JSON.parse(data.active_session?.review_json || '{}') || {};
            } catch (_) {
                savedReview = {};
            }
            setReview(savedReview);
            setCurrent(Number(data.active_session?.current_question || 0) || 0);
            setRemaining(Number(data.active_session?.remaining_seconds || 0) || ((Number(data.exam?.duration_minutes || 0) || 0) * 60));
            setResult(data.last_attempt || null);
            setState((p) => ({
                ...p,
                loading: false,
                exam: data.exam,
                questions: data.questions || [],
                active: data.active_session || null,
                mode: 'taking'
            }));
        } catch (e) {
            setErr(e.message || 'Unable to start exam');
        } finally {
            setStarting(false);
        }
    };

    const select = (qid, key) => {
        const nextAnswers = { ...answers };
        if (key === '') {
            delete nextAnswers[qid];
        } else {
            nextAnswers[qid] = key;
        }
        setAnswers(nextAnswers);
        apiPost('save_exam_draft', { exam_id: examIdNum, answers: nextAnswers, review_questions: review, current_question: current }, token).catch(() => {});
    };
    useEffect(() => {
        if (state.mode !== 'taking' || remaining === null) return undefined;
        const timer = setInterval(() => setRemaining((value) => Math.max(0, (value || 0) - 1)), 1000);
        return () => clearInterval(timer);
    }, [state.mode, remaining === null]);

    useEffect(() => {
        if (state.mode !== 'taking' || remaining !== 0 || submitting || !state.questions.length) return;
        apiPost('submit_exam', { exam_id: examIdNum, answers }, token)
            .then((out) => {
                setResult(out.result);
                setMsg('Time over. Test submitted.');
                return apiGet('exam_overview', { exam_id: examIdNum }, token);
            })
            .then((overview) => {
                setState((p) => ({
                    ...p,
                    exam: overview.exam || p.exam,
                    attempts: overview.attempts || [],
                    active: overview.active_session || null,
                    mode: 'overview',
                    questions: []
                }));
                setAnswers({});
                setReview({});
            })
            .catch((e) => setErr(e.message || 'Auto submit failed'));
    }, [remaining, state.mode, submitting, state.questions.length, examIdNum, token, answers]);

    const saveDraft = (extra = {}) => apiPost('save_exam_draft', {
        exam_id: examIdNum,
        answers,
        review_questions: review,
        current_question: current,
        ...extra
    }, token);

    const markReview = () => {
        const q = state.questions[current];
        if (!q) return;
        const nextReview = { ...review, [q.id]: !review[q.id] };
        setReview(nextReview);
        apiPost('save_exam_draft', { exam_id: examIdNum, answers, review_questions: nextReview, current_question: current }, token).catch(() => {});
    };

    const jumpTo = (index) => {
        const nextIndex = Math.max(0, Math.min(state.questions.length - 1, index));
        setCurrent(nextIndex);
        saveDraft({ current_question: nextIndex }).catch(() => {});
    };

    const submit = async () => {
        if (!token) return;
        setSubmitting(true);
        setErr('');
        try {
            const out = await apiPost('submit_exam', { exam_id: examIdNum, answers }, token);
            setResult(out.result);
            setMsg('Test submitted');
            const overview = await apiGet('exam_overview', { exam_id: examIdNum }, token);
            setState((p) => ({
                ...p,
                exam: overview.exam || p.exam,
                attempts: overview.attempts || [],
                active: overview.active_session || null,
                mode: 'overview',
                questions: []
            }));
            setAnswers({});
            setReview({});
        } catch (e) {
            setErr(e.message || 'Submit failed');
        } finally {
            setSubmitting(false);
        }
    };

    if (state.loading) return <PageLoader label="Loading exam" />;
    if (err) {
        return <section className="gov-limit-page"><div className="gov-limit-card"><span className="gov-limit-icon">!</span><small>Unable to open test</small><h1>Test load nahi ho paya</h1><p>{err}</p><div className="gov-limit-actions"><a className="btn secondary" href="#/exams">Back to Exams</a></div></div></section>;
    }    if (state.mode === 'overview') {
        const exam = state.exam || {};
        const active = state.active;
        const attempts = state.attempts || [];
        const last = attempts[0] || null;
        return (
            <section className="exam-detail-page">
                {msg ? <Message text={msg} /> : null}
                <div className="exam-detail-hero">
                    <div>
                        <div className="course-breadcrumb"><a href="#/exams">Mock Tests</a><span>/</span><b>{exam.title || 'Exam'}</b></div>
                        <h1>{exam.title}</h1>
                        <p>{exam.description || 'Read details, continue saved attempt or start a fresh exam when you are ready.'}</p>
                        <div className="exam-detail-meta">
                            <span>{exam.course_title || 'General'}</span>
                            <span>{exam.instructor_name || 'Instructor'}</span>
                            <span>{exam.duration_minutes || 0} min</span>
                            <span>{exam.total_questions || 0} questions</span>
                            <span>{safeNumber(exam.total_marks, 2)} marks</span>
                        </div>
                    </div>
                    <div className="exam-action-panel">
                        <span className="exam-status-pill">{active ? 'In Progress' : attempts.length ? 'Attempted' : 'Ready'}</span>
                        <h3>{active ? 'Continue your test' : 'Start when ready'}</h3>
                        <p>{active ? `${active.answered_count || 0} answered questions saved.` : 'Your attempt record and score will be saved automatically after submit.'}</p>
                        <button className="btn" onClick={loadPaper} disabled={starting}>{starting ? 'Loading...' : active ? 'Continue Exam' : attempts.length ? 'Retake Exam' : 'Start Exam'}</button>
                    </div>
                </div>

                <div className="exam-overview-grid">
                    <div className="exam-info-card">
                        <h3>Exam Details</h3>
                        <div className="exam-info-list">
                            <div><span>Type</span><b>{exam.is_live == 1 ? 'Live Test' : (exam.exam_type || 'Mock Test')}</b></div>
                            <div><span>Duration</span><b>{exam.duration_minutes || 0} min</b></div>
                            <div><span>Questions</span><b>{exam.total_questions || 0}</b></div>
                            <div><span>Total Marks</span><b>{safeNumber(exam.total_marks, 2)}</b></div>
                        </div>
                    </div>
                    <div className="exam-info-card">
                        <h3>Latest Performance</h3>
                        {last ? (
                            <div className="exam-score-line">
                                <strong>{safeNumber(last.percentage, 2)}%</strong>
                                <span>{safeNumber(last.score, 2)} / {safeNumber(last.total_marks, 2)} marks</span>
                                <p>Correct {last.correct_count}  -  Wrong {last.wrong_count}  -  Skipped {last.skipped_count}</p>
                            </div>
                        ) : <p className="small muted">No attempt submitted yet.</p>}
                    </div>
                </div>

                <div className="exam-info-card">
                    <div className="section-title">
                        <h3>All Attempts</h3>
                        <span className="small muted">{attempts.length} records</span>
                    </div>
                    {attempts.length ? (
                        <div className="attempt-table">
                            {attempts.map((a, i) => (
                                <div className="attempt-row" key={a.id}>
                                    <b>#{attempts.length - i}</b>
                                    <span>{a.submitted_at || a.started_at || '-'}</span>
                                    <span>{safeNumber(a.score, 2)} / {safeNumber(a.total_marks, 2)}</span>
                                    <span>{safeNumber(a.percentage, 2)}%</span>
                                    <small>Correct {a.correct_count} | Wrong {a.wrong_count} | Skipped {a.skipped_count}</small>
                                </div>
                            ))}
                        </div>
                    ) : <div className="live-empty">No attempt record yet.</div>}
                </div>
            </section>
        );
    }
    const question = state.questions[current] || null;
    const answeredCount = Object.values(answers).filter((v) => String(v || '').trim() !== '').length;
    const reviewCount = Object.keys(review).filter((key) => review[key]).length;
    const minutes = Math.floor((remaining || 0) / 60);
    const seconds = (remaining || 0) % 60;
    const questionText = question ? (lang === 'hi' ? (question.question_hi || question.question) : (question.question_en || question.question)) : '';
    const optionText = (op) => lang === 'hi' ? (op.text_hi || op.text) : (op.text_en || op.text);
    return (
        <section className="exam-taking-page">
            {msg ? <Message text={msg} /> : null}
            <div className="cbt-topbar">
                <div>
                    <a className="small" href={`#/exam/${examIdNum}`} onClick={(e) => { e.preventDefault(); setState((p) => ({ ...p, mode: 'overview' })); }}>Back to details</a>
                    <h2>{state.exam?.title}</h2>
                    <p>{answeredCount} answered  -  {reviewCount} marked  -  {state.questions.length} total</p>
                </div>
                <div className="cbt-tools">
                    <div className={`cbt-timer ${remaining <= 300 ? 'danger' : ''}`}>{String(minutes).padStart(2, '0')}:{String(seconds).padStart(2, '0')}</div>
                    <select className="input" value={lang} onChange={(e) => setLang(e.target.value)}>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                    </select>
                    <button className="btn secondary" onClick={() => saveDraft().then(() => setMsg('Draft saved.')).catch((e) => setErr(e.message))}>Save</button>
                </div>
            </div>

            <div className="cbt-layout">
                <main className="cbt-paper">
                    <div className="cbt-question-head">
                        <span>Question {current + 1} of {state.questions.length}</span>
                        <b>{review[question?.id] ? 'Marked for review' : answers[question?.id] ? 'Answered' : 'Not answered'}</b>
                    </div>
                    {question ? (
                        <>
                            <div className="cbt-question-text">{questionText}</div>
                            <div className="cbt-options">
                                {question.options.map((op) => (
                                    <button
                                        key={op.key}
                                        className={`cbt-option ${answers[question.id] === op.key ? 'selected' : ''}`}
                                        onClick={() => select(question.id, op.key)}
                                    >
                                        <span>{op.key}</span>
                                        <b>{optionText(op)}</b>
                                    </button>
                                ))}
                            </div>
                        </>
                    ) : <div className="live-empty">No questions available.</div>}
                    <div className="cbt-actions">
                        <button className="btn secondary" onClick={() => question && select(question.id, '')} disabled={!question}>Clear</button>
                        <button className="btn secondary" onClick={markReview} disabled={!question}>{review[question?.id] ? 'Unmark Review' : 'Mark Review'}</button>
                        <button className="btn secondary" onClick={() => jumpTo(current - 1)} disabled={current <= 0}>Previous</button>
                        <button className="btn" onClick={() => jumpTo(current + 1)} disabled={current >= state.questions.length - 1}>Save & Next</button>
                    </div>
                </main>

                <aside className="cbt-sidebar">
                    <div className="cbt-summary">
                        <div><strong>{answeredCount}</strong><span>Answered</span></div>
                        <div><strong>{state.questions.length - answeredCount}</strong><span>Pending</span></div>
                        <div><strong>{reviewCount}</strong><span>Review</span></div>
                    </div>
                    <div className="cbt-palette">
                        {state.questions.map((q, index) => (
                            <button
                                key={q.id}
                                className={`${index === current ? 'active' : ''} ${answers[q.id] ? 'answered' : ''} ${review[q.id] ? 'review' : ''}`}
                                onClick={() => jumpTo(index)}
                            >
                                {index + 1}
                            </button>
                        ))}
                    </div>
                    {result ? <div className="cbt-last small muted">Last score: {safeNumber(result.score, 2)} / {safeNumber(result.total_marks, 2)}</div> : null}
                    <button className="btn danger" onClick={submit} disabled={submitting || state.questions.length === 0}>
                        {submitting ? 'Submitting...' : 'Submit Test'}
                    </button>
                </aside>
            </div>
        </section>
    );
}

function ProfilePage({ token, user, onUpdated }) {
    const [state, setState] = useState({ loading: true, form: {}, current: '', next: '', confirm: '', report: null });
    const [msg, setMsg] = useState('');
    const [err, setErr] = useState('');
    const [busy, setBusy] = useState(false);

    useEffect(() => {
        if (!token) { setState((p) => ({ ...p, loading: false })); return; }
        Promise.all([
            apiGet('profile', {}, token),
            apiGet('student_report', {}, token).catch(() => null)
        ])
            .then(([data, report]) => {
                setState((p) => ({ ...p, loading: false, form: { ...data.user }, report }));
            })
            .catch((e) => {
                setErr(e.message || 'Failed to load');
                setState((p) => ({ ...p, loading: false }));
            });
    }, [token]);

    const updateProfile = async (e) => {
        e.preventDefault();
        setBusy(true); setErr(''); setMsg('');
        try {
            const body = { ...state.form };
            const out = await apiPost('update_profile', body, token);
            setMsg(out.message || 'Profile updated');
            onUpdated(out.user);
        } catch (e2) {
            setErr(e2.message);
        } finally {
            setBusy(false);
        }
    };

    const updatePassword = async (e) => {
        e.preventDefault();
        if (state.next.length < 8) return setErr('New password must be at least 8 characters');

            setState((p) => ({ ...p, current: '', next: '', confirm: '' }));

function GcoinPage({ token }) {

    const [err, setErr] = useState('');

    useEffect(() => {
        let stop = false;
        (async () => {
            if (!token) {
                window.location.hash = '#/login';
                return;
            }
            try {
                const data = await apiGet('gcoin_wallet', {}, token);
                if (!stop) setState({ loading: false, data });
            } catch (e) {
                if (!stop) {
                    setErr(e.message || 'Gcoin wallet load failed');
                    setState({ loading: false, data: null });
                }
            }
        })();
        return () => { stop = true; };
    }, [token]);

    if (state.loading) return <PageLoader label="Loading Gcoin wallet" />;
    if (err && !state.data) return <Message text={err} kind="error" />;

    const data = state.data || {};
    const coin = data.coin_name || 'Gcoin';

        try {

        } catch (_) {
            setMsg(`Referral code: ${code}`);

    return (
        <section>

            <div className="gcoin-hero">

function PaymentStatusPage({ txn }) {
    const { token } = React.useContext(AppContext);
    const [state, setState] = useState({ loading: true, data: null, error: '' });
    const [retrying, setRetrying] = useState(false);
    const refresh = useCallback(async () => {
        setState((s) => ({ ...s, loading: true, error: '' }));
        try {
            const data = await apiGet('payment_status', { txn });
            setState({ loading: false, data, error: '' });
        } catch (e) {
            setState({ loading: false, data: null, error: e.message || 'Payment check failed' });
        }
    }, [txn]);
    useEffect(() => {
        let active = true;
        (async () => {
            try {
                const data = await apiGet('payment_status', { txn });
                if (active) setState({ loading: false, data, error: '' });
            } catch (e) {
                if (active) setState({ loading: false, data: null, error: e.message || 'Payment check failed' });
            }
        })();
        return () => { active = false; };
    }, [txn]);
    const paid = state.data?.paid;
    const failed = state.data?.failed;
    const pending = state.data?.pending;
    useEffect(() => {
        if (state.loading) return;
        if (!paid) return undefined;
        const timer = window.setTimeout(() => {
            window.location.hash = '#/dashboard';
        }, 600);
        return () => window.clearTimeout(timer);
    }, [state.loading, paid]);
    const retryPayment = async () => {
        if (!token) {
            window.location.hash = '#/login';
            return;
        }
        setRetrying(true);
        try {
            const data = await apiPost('retry_payment', { transaction_no: txn }, token);
            if (data.payment_required && data.payment?.payment_url) {
                window.location.href = data.payment.payment_url;
                return;
            }
            window.location.hash = '#/dashboard';
        } catch (e) {
            if (isBillingRequiredError(e)) {
                goBillingInfo(`#/payment-status/${txn}`);
                return;
            }
            alert(e.message || 'Retry payment start nahi ho paya.');
        } finally {
            setRetrying(false);
        }
    };
    if (state.loading || paid) {
        return (
            <PageLoader
                label={state.loading ? 'Payment verify ho raha hai' : 'Payment successful, dashboard open ho raha hai'}
                sub={txn ? `Transaction: ${txn}` : 'Please wait'}
            />
        );
    }
    const statusLabel = failed ? 'Payment failed' : pending ? 'Payment pending' : 'Payment not completed';
    return (
        <section className="payment-result-page">
            <div className={`payment-result-card ${failed ? 'failed' : 'pending'}`}>
                <span className="status-pill">{failed ? 'Failed' : 'Pending'}</span>
                <h1>{statusLabel}</h1>
                <p>{failed ? 'Aap retry karke same plan ka payment dubara start kar sakte hain.' : 'PhonePe se final confirmation abhi pending hai. Refresh karke status check karein.'}</p>
                <div className="payment-result-meta">
                    <div><span>Transaction</span><b>{txn || '-'}</b></div>
                    <div><span>Status</span><b>{statusLabel}</b></div>
                    <div><span>Access</span><b>{failed ? 'Not activated' : 'Waiting confirmation'}</b></div>
                </div>
                <div className="payment-result-actions">
                    <button className="btn" type="button" onClick={retryPayment} disabled={retrying}>{retrying ? 'Starting...' : 'Retry Payment'}</button>
                    <button className="btn secondary" type="button" onClick={refresh}>Check Again</button>
                    <a className="btn secondary" href="#/">Plans</a>
                </div>
            </div>
        </section>
    );
}

function GovtPrepPage({ token, routeQuery = null }) {
    const [state, setState] = useState({ loading: true, documents: [], live: [], mocks: [], categories: [], subscription: null, plans: [] });
    const [tab, setTab] = useState('mocks');
    const requestedParentId = Number(routeQuery?.get('parent') || 0);
    const requestedCategoryId = Number(routeQuery?.get('cat') || 0);
    const [activeParentId, setActiveParentId] = useState(requestedParentId);
    const [activeCategoryId, setActiveCategoryId] = useState(requestedCategoryId);
    const [examSearch, setExamSearch] = useState('');
    const [err, setErr] = useState('');
    const load = useCallback(async () => {
        setErr('');
        try {
            const data = await apiGet('gov_prep', {}, token || '', { timeoutMs: token ? 25000 : 12000 });
            setState({
                loading: false,
                documents: data.documents || [],
                live: data.live || [],
                mocks: data.mocks || [],
                categories: data.categories || [],
                subscription: data.subscription || null,
                plans: data.plans || []
            });
        } catch (e) {
            if (token && /timed out|abort/i.test(e.message || '')) {
                try {
                    const data = await apiGet('gov_prep', {}, '', { timeoutMs: 16000 });
                    setState({
                        loading: false,
                        documents: data.documents || [],
                        live: data.live || [],
                        mocks: data.mocks || [],
                        categories: data.categories || [],
                        subscription: null,
                        plans: data.plans || []
                    });
                    setErr('');
                    return;
                } catch (_) {}
            }
            setErr(e.message || 'Government exam prep load failed.');
            setState((s) => ({ ...s, loading: false }));
        }
    }, [token]);
    useEffect(() => { load(); }, [load]);
    useEffect(() => {
        if (requestedParentId) setActiveParentId(requestedParentId);
        if (requestedCategoryId) {
            setActiveCategoryId(requestedCategoryId);
            setTab('mocks');
        }
    }, [requestedParentId, requestedCategoryId]);
    const requireLogin = () => {
        if (!token) {
            rememberLoginReturn();
            return false;
        }
        return true;
    };
    if (state.loading) return <GovPrepLineLoader />;
    const sourceList = state.mocks;
    const activeList = activeCategoryId
        ? sourceList.filter((item) => Number(item.subcategory_id || item.category_id || 0) === Number(activeCategoryId))
        : activeParentId
            ? sourceList.filter((item) => Number(item.category_id || 0) === Number(activeParentId))
            : sourceList;
    const parents = state.categories.filter((cat) => !cat.parent_id);
    const selectedParent = state.categories.find((cat) => Number(cat.id) === Number(activeParentId)) || parents[0] || null;
    const selectedChildren = selectedParent ? state.categories.filter((cat) => Number(cat.parent_id || 0) === Number(selectedParent.id)) : [];
    const selectedCategory = state.categories.find((cat) => Number(cat.id) === Number(activeCategoryId)) || null;
    const allChildren = state.categories.filter((cat) => cat.parent_id);
    const query = examSearch.trim().toLowerCase();
    const visibleParents = query
        ? parents.filter((parent) => parent.name.toLowerCase().includes(query) || allChildren.some((child) => Number(child.parent_id) === Number(parent.id) && child.name.toLowerCase().includes(query)))
        : parents;
    const visibleChildren = query
        ? allChildren.filter((child) => child.name.toLowerCase().includes(query)).slice(0, 48)
        : selectedChildren;
    const initials = (name) => String(name || 'EX').split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part.charAt(0)).join('').toUpperCase();
    const cleanMockTitle = (title) => String(title || 'Practice Test').replace(/\s*-\s*\d+\s*Questions?/i, '').trim();
    const currentPlanName = state.subscription?.plan_name || (token ? 'Free membership' : 'Login required');
    const examSelectValue = activeCategoryId ? `c:${activeCategoryId}` : selectedParent ? `p:${selectedParent.id}` : 'all';
    const selectedExamTitle = selectedCategory?.name || (activeParentId ? selectedParent?.name : '') || 'All exam preparation';
    const selectedExamDescription = selectedCategory?.description || selectedParent?.description || `${selectedExamTitle} ke latest mock tests, practice papers aur exam preparation resources.`;
    const buildExamDetail = (title, parentName, description) => {
        const label = String(title || 'Government Exam');
        const parentLabel = String(parentName || 'Government Exams');
        const text = `${label} ${parentLabel}`.toLowerCase();
        let focus = 'reasoning, general awareness, quantitative aptitude and exam-level practice';
        let audience = 'serious exam aspirants';
        let note = 'Aspirants should attempt timed mocks, revise weak topics and review every solution before moving to the next paper.';
        let patternRows = [
            ['Core Practice', 'Mixed', 'Timed mock sets'],
            ['Revision', 'Topic wise', 'Analysis based']
        ];
        if (/sbi|bank|rbi|po|clerk/.test(text)) {
            focus = 'banking awareness, reasoning, quantitative aptitude, English and computer aptitude';
            audience = 'banking exam aspirants';
            note = 'Prelims speed, mains accuracy and sectional balance are important, so daily attempts should be followed by error review.';
            patternRows = [['Reasoning Ability', '35+', 'Speed practice'], ['Quantitative Aptitude', '35+', 'Calculation drills'], ['English and Banking', '30+', 'Concept review']];
        } else if (/jee|iit|engineering/.test(text)) {
            focus = 'Physics, Chemistry and Mathematics with previous-year style objective questions';
            audience = 'engineering entrance aspirants';
            note = 'Keep formula revision, concept clarity and subject-wise mock analysis together for stronger exam readiness.';
            patternRows = [['Physics', '20+', 'Concept practice'], ['Chemistry', '20+', 'NCERT based revision'], ['Mathematics', '20+', 'Problem solving']];
        } else if (/ctet|utet|teacher|pedagogy|child development|hindi|sanskrit|environmental|mathematics/.test(text)) {
            focus = 'pedagogy, language, EVS, mathematics and classroom-method questions';
            audience = 'teacher eligibility exam learners';
            note = 'Pedagogy concepts, language comprehension and child development topics should be revised with topic-wise mock practice.';
            patternRows = [['Pedagogy', '30+', 'Concept clarity'], ['Language and EVS', '30+', 'Practice sets'], ['Mathematics', '30+', 'Teaching method']];
        } else if (/police|rpf|constable|sub inspector|defence|agniveer/.test(text)) {
            focus = 'reasoning, general knowledge, basic mathematics, current affairs and uniformed-service practice';
            audience = 'police, defence and uniformed service aspirants';
            note = 'Written practice should be planned with physical test awareness, current affairs revision and previous paper analysis.';
            patternRows = [['Reasoning', '25+', 'Accuracy practice'], ['General Awareness', '35+', 'Current affairs'], ['Mathematics', '25+', 'Timed drills']];
        } else if (/rpsc|rajasthan|ukpsc|uksssc|hppsc|mppsc|lekhpal|state/.test(text)) {
            focus = 'state GK, reasoning, Hindi or English, subject knowledge and previous-paper style mocks';
            audience = 'state government exam aspirants';
            note = 'State-specific GK, old papers and syllabus-mapped practice should stay at the center of preparation.';
            patternRows = [['State GK', '40+', 'Local focus'], ['Reasoning and Aptitude', '30+', 'Daily drills'], ['Subject Knowledge', '40+', 'Previous papers']];
        } else if (/ssc|gd|cgl|chsl/.test(text)) {
            focus = 'reasoning, general awareness, mathematics and English for SSC pattern practice';
            audience = 'SSC exam aspirants';
            note = 'Section-wise speed and revision of repeated question types makes SSC preparation more consistent.';
            patternRows = [['Reasoning', '25+', 'Speed practice'], ['General Awareness', '25+', 'Static GK'], ['Maths and English', '50+', 'Mixed mocks']];
        } else if (/railway|rrb/.test(text)) {
            focus = 'railway-focused mathematics, reasoning, general science and current affairs';
            audience = 'railway exam aspirants';
            note = 'General science and current affairs should be revised with short daily tests and full mock attempts.';
            patternRows = [['Mathematics', '30+', 'Timed drills'], ['Reasoning', '30+', 'Practice sets'], ['General Science and GK', '40+', 'Revision']];
        }
        return {
            audience,
            focus,
            note,
            subtitle: `${label}: notification, eligibility, exam pattern and practice plan`,
            summary: description || `${label} preparation is designed for ${audience}. It brings ${focus} into a cleaner track so students can continue preparation without searching in multiple places.`,
            patternRows,
            eligibility: `${label} eligibility and syllabus can vary by notification. Students should confirm the official notice, then use this track for mock tests, revision and performance analysis.`,
            dates: [
                ['Notification', 'As per official update'],
                ['Application', 'Check latest notice'],
                ['Exam Date', 'To be announced'],
                ['Result', 'After exam cycle']

    const continueMock = activeList[0] || sourceList[0] || null;
    const selectedQuestionCount = activeList.reduce((sum, item) => sum + Number(item.total_questions || item.question_count || 0), 0);
    const nestedChildren = activeCategoryId ? state.categories.filter((cat) => Number(cat.parent_id || 0) === Number(activeCategoryId)) : selectedChildren;
    const childTrackTitle = activeCategoryId ? `${selectedCategory?.name || 'Selected exam'} child categories` : `${selectedParent?.name || 'Exam'} tracks`;
    const examDetail = buildExamDetail(selectedExamTitle, selectedParent?.name, selectedExamDescription);
    const averageQuestions = activeList.length ? Math.round(selectedQuestionCount / activeList.length) : 0;
    const examInfoPoints = [
        `${selectedExamTitle} track me ${examDetail.focus} ko simple study flow me rakha gaya hai.`,

    const cardDescription = `${selectedExamTitle} ke exam-pattern questions ke saath timed practice set. Attempt ke baad score aur weak areas review karein.`;
    const relatedExamParents = parents.filter((parent) => Number(parent.id) !== Number(selectedParent?.id || 0)).slice(0, 8);
    const chooseExamTrack = (value) => {

    return (
        <section className="gov-prep-public">
            <div className="gov-exam-search">
                <input value={examSearch} onChange={(e) => setExamSearch(e.target.value)} placeholder="Search exam category, SSC, Railway, JEE..." />

            </div>
            <div className="gov-exam-workbench">

                <aside className="gov-exam-select-card">

                        {selectedParent ? <option value={`p:${selectedParent.id}`}>All {selectedParent.name}</option> : <option value="all">All Exams</option>}
                        {selectedChildren.map((child) => <option key={`child-${child.id}`} value={`c:${child.id}`}>{child.name}</option>)}
                    </select>
                    <div className="gov-exam-plan-facts">
                        <span><b>{activeList.length}</b><small>Mock Tests</small></span>
                        <span><b>{selectedQuestionCount}</b><small>Questions</small></span>
                    </div>
                    <a className={`btn ${continueMock ? '' : 'secondary'}`} href={continueMock ? `#/govt-mock/${continueMock.id}` : '#/govt-prep'}>{continueMock ? 'Continue Prep' : 'Content Coming'}</a>

            </div>
            <div className="gov-popular-block gov-exam-directory">

                    <div>

                            {parent.name}

                </div>
                <div className="gov-exam-card-grid">
                    {visibleChildren.slice(0, 9).map((exam) => (

                            <strong>{exam.name}</strong>
                            <span className="gov-exam-arrow">&rsaquo;</span>

                    {!visibleChildren.length ? <div className="card"><h3>No exam found</h3><p className="muted">Search ko thoda change karke try karo.</p></div> : null}
                </div>
            </div>
            <div className="gov-public-hero">
                <div>
                    <span>Membership only preparation</span>

                    <p>Abhi temporary setup me sirf exam practice/mock test access rahega. Yahan koi single payment nahi hoga.</p>
                    <div className="gov-hero-stats">
                        <span><b>{parents.length}</b><small>Main categories</small></span>
                        <span><b>{state.categories.length - parents.length}</b><small>Popular exams</small></span>
                        <span><b>{state.mocks.length}</b><small>Mock exams</small></span>
                    </div>
                    <div className="hero-actions">
                        <button className="btn" onClick={() => setTab('mocks')}>Explore Mocks</button>
                    </div>
                </div>
                <div className="gov-plan-card">
                    <small>Current access</small>
                    <strong>{currentPlanName}</strong>
                    <p>{token ? 'Your mock exam limits are controlled by membership plan.' : 'Login and activate membership to unlock exam practice.'}</p>
                    <a className="btn ghost" href={token ? '#/' : '#/login'}>{token ? 'View Membership Plans' : 'Login to Access'}</a>
                </div>
            </div>
            <div className="gov-membership-note">
                <div>
                    <strong>Membership based access only</strong>

                </div>
                <span className="gov-access-tag">{state.subscription?.plan_name ? 'Active membership' : 'Plan required'}</span>
            </div>
            {err ? <Message text={err} kind="error" /> : null}
            <div className="gov-exam-detail-layout">
                <main className="gov-exam-detail-main">
                    <div className="gov-exam-demo-strip">
                        <strong>Take a Free Demo</strong>
                        <a href={continueMock ? `#/govt-mock/${continueMock.id}` : '#/govt-prep'}>Start Demo</a>
                    </div>
                    <div className="gov-detail-tabs">
                        <button className="active" type="button">Exam Info</button>
                        <button type="button">Videos</button>
                        <button type="button">Quizzes</button>
                    </div>
                    <article className="gov-exam-article">
                        <h2>Summary</h2>
                        <p className="gov-lead-copy">{examDetail.subtitle}</p>
                        <p>{examDetail.summary}</p>
                        {examInfoPoints.map((point) => <p key={point}>{point}</p>)}
                        <h2>Exam Pattern</h2>
                        <div className="gov-pattern-meta">
                            <span>Total Sets : {activeList.length || 'Available soon'}</span>
                            <span>Avg Questions : {averageQuestions || selectedQuestionCount || 'As per test'}</span>
                            <span>Track : {selectedParent?.name || 'All Exams'}</span>
                        </div>
                        <table className="gov-pattern-table">
                            <tbody>
                                <tr><th>Subject</th><th>Qns.</th><th>Practice</th></tr>
                                {examDetail.patternRows.map((row) => <tr key={row[0]}><td>{row[0]}</td><td>{row[1]}</td><td>{row[2]}</td></tr>)}
                                <tr><td>Total Practice</td><td>{selectedQuestionCount || '-'}</td><td>{activeList.length || 0} mock sets</td></tr>
                            </tbody>
                        </table>
                        <h2>Eligibility & Preparation</h2>
                        <p>{examDetail.eligibility}</p>
                        <p>{selectedExamTitle} ke learners ko syllabus-wise revision, timed mock practice aur result analysis par focus karna chahiye. Har mock complete karne ke baad incorrect topics revise karein aur next test attempt karein.</p>
                        {nestedChildren.length ? <div className="gov-inline-child-list">
                            <h2>Sub Categories</h2>
                            <div>
                                {nestedChildren.slice(0, 8).map((child) => <a key={child.id} href={`#/govt-prep?cat=${child.id}&parent=${child.parent_id || activeParentId || 0}`}>{child.name}</a>)}
                            </div>
                        </div> : null}
                    </article>
                </main>
                <aside className="gov-exam-detail-side">
                    <div className="gov-side-card blue">
                        <h3>{selectedExamTitle}</h3>
                        <div className="gov-side-mini-grid">
                            <span><b>{activeList.length}</b><small>Mock Tests</small></span>
                            <span><b>{selectedQuestionCount}</b><small>Questions</small></span>
                        </div>
                        <a className="btn" href={continueMock ? `#/govt-mock/${continueMock.id}` : '#/govt-prep'}>Continue Prep</a>
                    </div>
                    <div className="gov-side-card gov-side-dates">
                        <h3>Important Dates</h3>
                        {examDetail.dates.map((item) => <span key={item[0]}><b>{item[0]}</b><em>{item[1]}</em></span>)}
                    </div>
                    <div className="gov-side-card">
                        <h3>Important Links</h3>
                        <a href="#/govt-prep">All exam categories</a>
                        <a href={continueMock ? `#/govt-mock/${continueMock.id}` : '#/govt-prep'}>Start mock test</a>
                        <a href="#/upgrade-plan">Membership access</a>
                    </div>
                </aside>
            </div>
            {nestedChildren.length ? <div className="gov-child-track-panel">
                <div className="gov-child-track-head">
                    <div>
                        <span className="gov-selected-kicker">More inside this exam</span>
                        <h2>{childTrackTitle}</h2>
                    </div>
                    <small>{nestedChildren.length} categories</small>
                </div>
                <div className="gov-child-track-grid">
                    {nestedChildren.map((child) => {
                        const childMocks = sourceList.filter((item) => Number(item.subcategory_id || item.category_id || 0) === Number(child.id));
                        return <a className="gov-child-track-card" key={child.id} href={`#/govt-prep?cat=${child.id}&parent=${child.parent_id || activeParentId || 0}`}>
                            <i>{initials(child.name)}</i>
                            <strong>{child.name}</strong>
                            <span>{childMocks.length} mocks</span>
                        </a>;
                    })}
                </div>
            </div> : null}
            {false && parents.length ? (
                <>
                <div className="gov-section-title explore-title">
                    <div>
                        <h2>{state.categories.length - parents.length}+ Exam Tracks</h2>
                        <p>Category select karke related exam practice sets filter karo.</p>
                    </div>
                </div>
                <div className="gov-category-browser">
                    <div className="gov-category-sidebar">
                        {visibleParents.map((parent) => (
                            <button key={parent.id} className={`gov-category-tab ${Number(selectedParent?.id || 0) === Number(parent.id) ? 'active' : ''}`} onClick={() => { setActiveParentId(Number(parent.id)); setActiveCategoryId(0); }}>
                                <i>{initials(parent.name)}</i>
                                <span>{parent.name}</span>
                                <b>&gt;</b>
                            </button>
                        ))}
                    </div>
                    <div className="gov-subcategory-panel">
                        <div className="gov-subcategory-head">
                            <div>
                                <h2>{selectedParent?.name || 'Exam Categories'}</h2>
                                <p>{selectedParent?.description || 'Choose an exam category to explore preparation content.'}</p>
                            </div>
                            <span className="badge">{selectedChildren.length} exams</span>
                        </div>
                        <div className="gov-subcategory-grid">
                            {visibleChildren.map((child) => (
                                <a className="gov-subcategory-card" key={child.id} href="#/govt-prep" onClick={(e) => { e.preventDefault(); setActiveCategoryId(Number(child.id)); setTab('mocks'); }}>
                                    <i>{initials(child.name)}</i>
                                    <div>
                                        <strong>{child.name}</strong>
                                        <small>Membership exam practice sets</small>
                                    </div>
                                    <span>&gt;</span>
                                </a>
                            ))}
                            {!visibleChildren.length ? <div className="card"><h3>No exam found</h3><p className="muted">Search ko thoda change karke try karo.</p></div> : null}
                        </div>
                    </div>
                </div>
                </>
            ) : null}
            <div className="gov-public-tabs">
                <button className={tab === 'mocks' ? 'active' : ''} onClick={() => setTab('mocks')}>Exam Practice</button>
                {selectedCategory ? <button onClick={() => setActiveCategoryId(0)}>{selectedCategory.name} <b>Clear</b></button> : null}
            </div>
            <div className="gov-practice-layout">
                <div className="gov-public-grid">
                {activeList.map((mock) => {
                    const mockColorIndex = (Number(mock.id || 0) || String(mock.title || '').length || 1) % 5 + 1;
                    return (
                    <article className="gov-public-card" key={`mock-${mock.id}`}>
                        <div className={`gov-mock-thumb exam-cover exam-c${mockColorIndex}`}>
                            <span className="exam-cover-title">{mock.category_name || 'Live Test'}<small>with reports</small></span>
                            <span className="exam-cover-badge">{mock.question_count || mock.total_questions || 0} Questions</span>
                        </div>
                        <span className="gov-type">MOCK</span>
                        <h3>{cleanMockTitle(mock.title)}</h3>
                        <p>{cardDescription}</p>
                        <div className="gov-card-stats"><span>{mock.question_count || mock.total_questions || 0} Questions</span><span>{mock.duration_minutes || 0} Min</span></div>
                        {mock.last_attempt ? <div className="small">Last score: {safeNumber(mock.last_attempt.score, 2)} / {safeNumber(mock.last_attempt.total_marks, 2)}</div> : null}
                        <span className="gov-access-tag">Included in membership</span>
                        <button className={`btn ${mock.locked ? 'ghost' : ''}`} onClick={() => token ? window.location.hash = `#/govt-mock/${mock.id}` : rememberLoginReturn()}>{mock.locked ? 'Activate Plan' : 'Start Test'}</button>
                    </article>
                    );
                })}
                {activeList.length === 0 ? <div className="card"><h3>No content available</h3><p className="muted">Admin se content publish hone ke baad yahan dikhega.</p></div> : null}
                </div>
                <aside className="gov-related-exams">
                    <h3>Other Related Exam's</h3>
                    {relatedExamParents.map((parent) => (
                        <a key={parent.id} href={`#/govt-prep?parent=${parent.id}`}>
                            <i>{initials(parent.name)}</i>
                            <span><b>{parent.name}</b><em>Read More</em></span>
                        </a>
                    ))}
                </aside>
            </div>
        </section>
    );
}

function GovtMockPage({ token, mockId }) {
    const [state, setState] = useState({ loading: true, mock: null, questions: [], result: null });
    const [answers, setAnswers] = useState({});
    const [err, setErr] = useState('');
    useEffect(() => {
        let stop = false;
        (async () => {
            try {
                const data = await apiGet('gov_mock_detail', { id: mockId }, token);
                if (!stop) setState({ loading: false, mock: data.mock, questions: data.questions || [], result: null });
            } catch (e) {
                if (!stop) { setErr(e.message || 'Mock test load failed.'); setState((s) => ({ ...s, loading: false })); }
            }
        })();
        return () => { stop = true; };
    }, [token, mockId]);
    const submit = async () => {
        try {
            const data = await apiPost('submit_gov_mock', { mock_id: mockId, answers }, token);
            setState((s) => ({ ...s, result: data.result }));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
            alert(e.message || 'Submit failed.');
        }
    };
    if (state.loading) return <PageLoader label="Loading mock test" />;
        if (err) {
        const limitReached = /limit reached|upgrade your plan|membership/i.test(err);
        if (limitReached) {
            return (
                <section className="gov-limit-page">
                    <div className="gov-limit-card">
                        <span className="gov-limit-icon">!</span>
                        <small>Membership limit</small>
                        <h1>Mock test limit reached</h1>
                        <p>Aapke current plan ka mock test quota complete ho gaya hai. Practice continue karne ke liye membership upgrade karein.</p>
                        <div className="gov-limit-actions">
                            <a className="btn" href="#/upgrade-plan">Upgrade Plan</a>
                            <a className="btn secondary" href="#/govt-prep">Back to Prep</a>
                        </div>
                    </div>
                </section>
            );
        }
        return <section className="gov-limit-page"><div className="gov-limit-card"><span className="gov-limit-icon">!</span><small>Unable to open mock</small><h1>Mock test load nahi ho paya</h1><p>{err}</p><div className="gov-limit-actions"><a className="btn secondary" href="#/govt-prep">Back to Prep</a></div></div></section>;
    }
    const mock = state.mock || {};
    return (
        <section className="gov-mock-room">
            <div className="gov-mock-head">
                <div><a href="#/govt-prep">Government Exam Prep</a><h2>{mock.title || 'Mock Test'}</h2><p>{mock.description || `${mock.duration_minutes || 0} minutes practice test`}</p></div>
                <div className="gov-card-stats"><span>{state.questions.length} Questions</span><span>{mock.duration_minutes || 0} Min</span><span>{safeNumber(mock.total_marks, 2)} Marks</span></div>
            </div>
            {state.result ? (
                <div className="gov-result-card">
                    <h3>Result</h3>
                    <strong>{safeNumber(state.result.score, 2)} / {safeNumber(state.result.total_marks, 2)}</strong>
                    <p>{safeNumber(state.result.percentage, 2)}%  -  Correct {state.result.correct_count}  -  Wrong {state.result.wrong_count}  -  Skipped {state.result.skipped_count}</p>
                    <a className="btn" href="#/govt-prep">Back to Prep</a>
                </div>
            ) : null}
            <div className="gov-question-list">
                {state.questions.map((q, idx) => (
                    <article className="gov-question-card" key={q.id}>
                        <div className="gov-question-title"><span>Q{idx + 1}</span><div><b>{q.question_en || q.question_hi}</b>{q.question_hi && q.question_en ? <small>{q.question_hi}</small> : null}</div></div>
                        <div className="gov-options">
                            {Object.entries(q.options || {}).map(([key, opt]) => (
                                <label key={key} className={answers[q.id] === key ? 'selected' : ''}>
                                    <input type="radio" name={`q-${q.id}`} checked={answers[q.id] === key} onChange={() => setAnswers((a) => ({ ...a, [q.id]: key }))} />
                                    <span>{key}</span>
                                    <b>{opt.en || opt.hi || '-'}</b>
                                    {opt.hi && opt.en ? <small>{opt.hi}</small> : null}
                                </label>
                            ))}
                        </div>
                    </article>
                ))}
            </div>
            {!state.result ? <div className="gov-submit-bar"><button className="btn" onClick={submit}>Submit Test</button><a className="btn secondary" href="#/govt-prep">Cancel</a></div> : null}
        </section>
    );
}

function MobileBottomNav({ activePath, user }) {
    const homeHref = '#/';
    const accountHref = user ? '#/dashboard' : '#/login';
    const isHome = activePath === '/';
    const isMine = activePath === '/dashboard' || activePath === '/profile' || activePath === '/gcoin' || activePath === '/progress' || activePath === '/my-courses' || activePath === '/active-plan' || activePath === '/transactions' || activePath === '/invoices' || activePath === '/upgrade-plan' || activePath === '/login';
    return (
        <nav className="mobile-bottom-nav" aria-label="Mobile navigation">
            <a className={isHome ? 'active' : ''} href={homeHref}><strong></strong><span>Home</span></a>
            <a className={activePath === '/courses' || activePath.startsWith('/course/') || activePath.startsWith('/learn/') ? 'active' : ''} href="#/courses"><strong></strong><span>Courses</span></a>
            <a className={activePath === '/batches' || activePath.startsWith('/live/') ? 'active' : ''} href="#/batches"><strong></strong><span>Live</span></a>
            <a className={activePath === '/govt-prep' || activePath.startsWith('/govt-mock/') ? 'active' : ''} href="#/govt-prep"><strong></strong><span>Prep</span></a>
            <a className={isMine ? 'active' : ''} href={accountHref}><strong></strong><span>{user ? 'Dashboard' : 'Login'}</span></a>
        </nav>
    );
}

function MobileAppBar({ user, settings, logout }) {
    const appName = getBrandName(settings, 'GYAN NEXA');
    const [open, setOpen] = useState(false);
    const [menuOpen, setMenuOpen] = useState(false);
    const name = user?.name || user?.username || 'Student';
    const initial = String(name || 'S').slice(0, 1).toUpperCase();
    const photo = user?.photo || user?.profile_photo || '';
    const basePath = window.location.pathname.replace(/\/index(?:\.php)?(?:\/.*)?$/i, '').replace(/\/$/, '') || '';
    const activePath = (window.location.hash || '#/').replace(/^#/, '') || '/';
    const isActive = (path) => activePath === path || (path !== '/' && activePath.startsWith(`${path}/`));
    const closeMenu = () => setMenuOpen(false);

    useEffect(() => {
        const close = () => {
            setOpen(false);
            setMenuOpen(false);
        };
        window.addEventListener('hashchange', close);
        return () => window.removeEventListener('hashchange', close);
    }, []);

    const doLogout = () => {
        setOpen(false);
        setMenuOpen(false);
        if (logout) logout();
    };
    return (
        <div className="mobile-appbar">
            <button className="mobile-menu-btn" type="button" onClick={() => { setMenuOpen(true); setOpen(false); }} aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div className={`mobile-drawer-backdrop ${menuOpen ? 'open' : ''}`} onClick={closeMenu}></div>
            <aside className={`mobile-side-drawer ${menuOpen ? 'open' : ''}`} aria-hidden={!menuOpen}>
                <div className="mobile-drawer-head">
                    <strong>GYAN NEXA</strong>
                    <button className="mobile-drawer-close" type="button" onClick={closeMenu} aria-label="Close menu">&times;</button>
                </div>
                <div className="mobile-drawer-links">
                    <a className={isActive('/') ? 'active' : ''} href="#/">Home</a>
                    <a className={isActive('/courses') ? 'active' : ''} href="#/courses">Courses</a>
                    <a className={isActive('/batches') ? 'active' : ''} href="#/batches">Live Classes</a>
                    <a className={isActive('/exams') ? 'active' : ''} href="#/exams">Mock Tests</a>
                    <a className={isActive('/govt-prep') || activePath.startsWith('/govt-mock/') ? 'active' : ''} href="#/govt-prep">Govt Exam Prep</a>
                    <a className={isActive('/categories') ? 'active' : ''} href="#/categories">Categories</a>
                    <a className={isActive('/instructors') ? 'active' : ''} href="#/instructors">Instructors</a>
                    <a href={`${basePath}/register-institution`}>Institute Manage</a>
                    {user ? <a className={isActive('/active-plan') ? 'active' : ''} href="#/active-plan">Active Plan</a> : null}
                    {user ? <a className={isActive('/transactions') ? 'active' : ''} href="#/transactions">Transactions</a> : null}
                    {user ? <a className={isActive('/invoices') ? 'active' : ''} href="#/invoices">Invoices</a> : null}
                    {user ? <a className={isActive('/upgrade-plan') ? 'active' : ''} href="#/upgrade-plan">Upgrade Plan</a> : null}
                </div>
                <div className="mobile-drawer-actions">
                    {user ? (
                        <>
                            <a className="primary" href="#/dashboard">Dashboard</a>
                            <a href="#/profile">Profile</a>
                            <button type="button" onClick={doLogout}>Logout</button>
                        </>
                    ) : (
                        <>
                            <a className="primary" href="#/login">Login</a>
                            <a href="#/signup">Create Account</a>
                        </>
                    )}
                </div>
            </aside>
            <a className="mobile-title mobile-logo-title" href={user ? '#/dashboard' : '#/'} aria-label={appName}>
                <img src={BRAND_LOGO_URL} alt={appName} />
                <span>GYAN NEXA</span>
            </a>
            <a className="mobile-icon-btn mobile-search-btn" href="#/courses" aria-label="Search courses"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l4 4"></path></svg></a>
            <div className="mobile-profile-wrap">
                <button className="mobile-profile-trigger" type="button" onClick={() => setOpen(!open)} aria-label="Account menu">
                    {photo ? <img src={photo} alt="Profile" onError={(e) => { e.currentTarget.style.display = 'none'; }} /> : initial}
                </button>
                <div className={`mobile-profile-menu ${open ? 'open' : ''}`}>
                    <div className="mobile-profile-head">
                        <div className="avatar">{initial}</div>
                        <div><b>{user ? name : 'Guest'}</b><span>{user ? 'Learner account' : 'Login required'}</span></div>
                    </div>
                    {user ? (
                        <>
                            <a href="#/dashboard" onClick={() => setOpen(false)}>Dashboard</a>
                            <a href="#/profile" onClick={() => setOpen(false)}>Profile</a>
                            <button type="button" onClick={doLogout}>Logout</button>
                        </>
                    ) : (
                        <>
                            <a href="#/login" onClick={() => setOpen(false)}>Login</a>
                            <a href="#/signup" onClick={() => setOpen(false)}>Create Account</a>
                        </>
                    )}
                </div>
            </div>
        </div>
    );
}

function App() {
    const auth = useAuthAPI();
    const [route, setRoute] = useHashRoute();
    const [toast, setToast] = useState('');
    const [toastKind, setToastKind] = useState('info');
    const [authModalMode, setAuthModalMode] = useState(null);

    const setAuth = (nextUser, nextToken) => {
        auth.setAuth(nextUser, nextToken);
        setAuthModalMode(null);
        const savedReturn = localStorage.getItem('edu_login_return_hash') || '';
        localStorage.removeItem('edu_login_return_hash');
        const authPath = currentPath === '/login' || currentPath === '/signup';
        if (savedReturn && !/^#\/(login|signup)\b/.test(savedReturn)) window.location.hash = savedReturn;
        else if (authPath) window.location.hash = '#/';
    };

    const logout = () => {
        auth.logout();
        window.location.hash = '#/login';
    };

    const showToast = (text, kind = 'info') => {
        setToastKind(kind);
        setToast(text);
        window.clearTimeout(window.__toastTimer);
        window.__toastTimer = window.setTimeout(() => setToast(''), 2500);
    };
    useEffect(() => {
        const openAuthModal = (event) => {
            const target = event.target?.closest?.('a[href="#/login"],a[href="#/signup"]');
            if (!target || event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            setAuthModalMode(target.getAttribute('href') === '#/signup' ? 'signup' : 'login');
        };
        document.addEventListener('click', openAuthModal);
        return () => document.removeEventListener('click', openAuthModal);
    }, []);

    const currentPath = route?.path || '/';
    const goSearchCourses = (text) => {
        const qs = new URLSearchParams();
        if (text) qs.set('q', text);
        setRoute('/courses', qs);
    };
    const isPlayerRoute = currentPath.startsWith('/learn/');
    const isPaymentRoute = currentPath.startsWith('/payment-status/');

    const page = useMemo(() => {
        const loginRequired = () => <AuthModalPage onLogin={setAuth} onToast={showToast} initialMode="login" />;
        if (currentPath === '/login') return <HomePage token={auth.token} />;
        if (currentPath === '/signup') return <HomePage token={auth.token} />;
        if (currentPath.startsWith('/payment-status/')) return <PaymentStatusPage txn={pathLastSegment(currentPath)} />;
        if (currentPath === '/courses') return <CoursesPage query={route.query} />;
        if (currentPath === '/about') return <PublicInfoPage type="about" />;
        if (currentPath === '/privacy') return <PublicInfoPage type="privacy" />;
        if (currentPath === '/refund') return <PublicInfoPage type="refund" />;
        if (currentPath === '/terms') return <PublicInfoPage type="terms" />;
        if (currentPath === '/contact') return <PublicInfoPage type="contact" />;
        if (currentPath.startsWith('/category/')) return <CategoryCoursesPage categoryName={extractPathSegment(currentPath)} />;
        if (currentPath === '/dashboard') {
            if (!auth.token) return loginRequired();
            return <DashboardPage token={auth.token} user={auth.user} />;
        }
        if (currentPath === '/categories') return <CategoriesPage />;
        if (currentPath === '/instructors') return <InstructorsPage />;
        if (currentPath === '/my-courses') {
            if (!auth.token) return loginRequired();
            return <MyCoursesPage token={auth.token} />;
        }
        if (currentPath === '/progress') {
            if (!auth.token) return loginRequired();
            return <ProgressReportPage token={auth.token} />;
        }
        if (currentPath === '/gcoin') {
            if (!auth.token) return loginRequired();
            return <GcoinPage token={auth.token} />;
        }
        if (currentPath === '/active-plan') {
            if (!auth.token) return loginRequired();
            return <StudentBillingPage token={auth.token} view="active-plan" />;
        }
        if (currentPath === '/transactions') {
            if (!auth.token) return loginRequired();
            return <StudentBillingPage token={auth.token} view="transactions" />;
        }
        if (currentPath === '/invoices') {
            if (!auth.token) return loginRequired();
            return <StudentBillingPage token={auth.token} view="invoices" />;
        }
        if (currentPath === '/billing-info') {
            if (!auth.token) return loginRequired();
            return <BillingInfoPage token={auth.token} returnTo={route.query.get('return') || '#/active-plan'} />;
        }
        if (currentPath === '/upgrade-plan') {
            if (!auth.token) return loginRequired();
            return <StudentBillingPage token={auth.token} view="upgrade-plan" />;
        }
        if (currentPath.startsWith('/document/')) {
            return <DocumentDetailPage token={auth.token} documentId={pathLastSegment(currentPath)} />;
        }
        if (currentPath.startsWith('/read-pdf/')) {
            if (!auth.token) return loginRequired();
            return <PdfReaderPage token={auth.token} documentId={pathLastSegment(currentPath)} />;
        }
        if (currentPath.startsWith('/learn/')) {
            if (!auth.token) return loginRequired();
            return <CourseLearningPage token={auth.token} courseId={pathLastSegment(currentPath)} selectedChapterId={route.query.get('chapter') || ''} />;
        }
        if (currentPath.startsWith('/course/')) {
            if (!auth.token) return loginRequired();
            return <CourseDetailPage token={auth.token} courseId={pathLastSegment(currentPath)} />;
        }
        if (currentPath.startsWith('/live/')) {
            if (!auth.token) return loginRequired();
            const parts = pathSegment(currentPath).split('/').filter(Boolean);
            return <LiveClassRoomPage token={auth.token} sourceType={parts[1] || 'class'} sourceId={parts[2] || 0} />;
        }
        if (currentPath === '/batches') {
            if (!auth.token) return loginRequired();
            return <BatchesPage token={auth.token} />;
        }
        if (currentPath.startsWith('/exam/')) {
            if (!auth.token) return loginRequired();
            return <ExamPage token={auth.token} examId={pathLastSegment(currentPath)} />;
        }
        if (currentPath === '/exams') {
            if (!auth.token) return loginRequired();
            return <ExamsPage token={auth.token} />;
        }
        if (currentPath === '/govt-prep') {
            return <GovtPrepPage token={auth.token} routeQuery={route.query} />;
        }
        if (currentPath.startsWith('/govt-mock/')) {
            if (!auth.token) return loginRequired();
            return <GovtMockPage token={auth.token} mockId={pathLastSegment(currentPath)} />;
        }
        if (currentPath === '/profile') {
            if (!auth.token) return loginRequired();
            return <ProfilePage token={auth.token} user={auth.user} onUpdated={(u)=>auth.setAuth(u, auth.token)} />;
        }
        if (currentPath === '/' || currentPath === '') return <HomePage token={auth.token} />;
        return <NotFoundPage />;
    }, [currentPath, route, auth.token, auth.user]);

    const routeAuthMode = currentPath === '/login' ? 'login' : (currentPath === '/signup' ? 'signup' : null);
    const visibleAuthMode = authModalMode || routeAuthMode;

    return (
        <AppContext.Provider value={auth}>
            <div>
                {!isPlayerRoute && !isPaymentRoute ? (
                    <TopBar
                        user={auth.user}
                        logout={logout}
                        homeRoute={(p)=>setRoute(p)}
                        activePath={currentPath}
                        onSearch={goSearchCourses}
                    />
                ) : null}
                {!isPlayerRoute && !isPaymentRoute ? <MobileAppBar user={auth.user} settings={auth.settings} logout={logout} /> : null}
                <Toast text={toast} kind={toastKind} onClose={() => setToast('')} />
                <main className={`app-shell ${isPlayerRoute ? 'player-shell' : ''} ${isPaymentRoute ? 'payment-shell' : ''}`}>
                    {auth.loading ? <PageLoader label="Checking session" sub="Securing your learner account." /> : page}
                </main>
                {visibleAuthMode && !isPlayerRoute && !isPaymentRoute ? (
                    <AuthModalPage
                        onLogin={setAuth}
                        onToast={showToast}
                        initialMode={visibleAuthMode}
                        onModeChange={setAuthModalMode}
                        onClose={() => {
                            setAuthModalMode(null);
                            if (routeAuthMode) window.location.hash = '#/';
                        }}
                    />
                ) : null}
                {!isPlayerRoute && !isPaymentRoute ? <SiteFooter /> : null}
                {!isPlayerRoute && !isPaymentRoute ? <MobileBottomNav activePath={currentPath} user={auth.user} /> : null}
            </div>
        </AppContext.Provider>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
